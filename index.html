<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111"><meta name="description" content="SHREE JI CONNECT - Customer, Order and WhatsApp management">
<link rel="manifest" href="manifest.json"><title>SHREE JI CONNECT</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f4f4;color:#171717}.top{position:sticky;top:0;z-index:20;background:#111;color:#fff;padding:13px 16px;display:flex;align-items:center;gap:12px}.logo{width:46px;height:46px;border-radius:50%;background:#d4ad58;color:#111;display:grid;place-items:center;font-weight:800;font-size:17px}.top h1{font-size:18px;margin:0}.top small{color:#ccc}.wrap{max-width:1050px;margin:auto;padding:16px 14px 50px}.nav{display:flex;gap:8px;overflow:auto;padding:4px 0 12px;position:sticky;top:72px;z-index:10;background:#f4f4f4}.nav button{white-space:nowrap;border:1px solid #ddd;background:#fff;border-radius:11px;padding:10px 13px;font-weight:700}.nav button.active{background:#d4ad58;color:#fff;border-color:#d4ad58}.card{background:#fff;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 2px 12px #0000000d}.hero{padding:22px}.hero h2{font-size:28px;margin:0 0 8px}.muted{color:#777}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#fff;border-radius:17px;padding:18px;box-shadow:0 2px 12px #0000000d}.stat b{font-size:27px;display:block}.btn{border:0;border-radius:11px;padding:11px 15px;background:#eee;font-weight:700;font-size:15px}.gold{background:#d0aa55;color:#fff}.green{background:#168b58;color:#fff}.red{background:#d84b4b;color:#fff}.dark{background:#222;color:#fff}.small{padding:8px 10px;font-size:13px}.field{margin:11px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:13px;border:1px solid #ddd;border-radius:11px;font-size:16px;background:#fff}.field textarea{min-height:120px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap}.customer{border:1px solid #eee;border-radius:16px;padding:15px;margin:10px 0}.customer h3{margin:0 0 7px}.history{border-top:1px solid #eee;margin-top:13px;padding-top:13px}.order{border:1px solid #eee;border-radius:12px;padding:12px;margin:8px 0}.pill{display:inline-block;padding:4px 8px;border-radius:20px;background:#eee;font-size:12px;font-weight:700}.search{width:100%;padding:13px;border:1px solid #ddd;border-radius:11px;font-size:16px}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:50;align-items:flex-end}.modal.show{display:flex}.box{background:#fff;width:100%;max-width:720px;margin:auto;border-radius:22px 22px 0 0;padding:20px;max-height:94vh;overflow:auto}.close{float:right;border:0;background:#eee;border-radius:50%;width:35px;height:35px;font-size:20px}.empty{text-align:center;color:#888;padding:25px}.toast{display:none;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:12px 17px;border-radius:10px;z-index:100;max-width:90%;text-align:center}.danger{color:#b22}.template{border:1px solid #eee;border-radius:13px;padding:14px;margin:9px 0}.checkrow{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid #eee}.checkrow input{width:20px;height:20px}.preview{background:#f8f8f8;border-radius:12px;padding:13px;white-space:pre-wrap}.footer{text-align:center;color:#888;font-size:12px;padding:20px}.hide{display:none!important}
@media(max-width:720px){.stats{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}.hero h2{font-size:24px}.nav{top:72px}}
</style></head>
<body>
<header class="top"><div class="logo">SJ</div><div><h1>SHREE JI CONNECT</h1><small>SHREE JI GOLD CREATOR LLP</small></div></header>
<div class="wrap">
<div class="nav" id="nav"><button data-page="dashboard" onclick="page('dashboard')">🏠 Dashboard</button><button data-page="customers" onclick="page('customers')">👥 Customers</button><button data-page="orders" onclick="page('orders')">📦 Orders</button><button data-page="whatsapp" onclick="page('whatsapp')">💬 WhatsApp</button><button data-page="templates" onclick="page('templates')">📝 Templates</button><button data-page="backup" onclick="page('backup')">💾 Backup</button></div>
<main id="app"></main><div class="footer">SHREE JI CONNECT • Data stays in this browser unless you export a backup.</div></div>
<div id="modal" class="modal"><div class="box"><button class="close" onclick="closeModal()">×</button><div id="form"></div></div></div><div id="toast" class="toast"></div>
<script>
const KEY='shree_ji_connect_full_v1';
let DB=loadDB();
function loadDB(){try{let d=JSON.parse(localStorage.getItem(KEY)||'null');if(d&&d.customers&&d.templates)return d}catch(e){}return{customers:[],templates:defaultTemplates(),orders:[]}}
function saveDB(){localStorage.setItem(KEY,JSON.stringify(DB))}
function defaultTemplates(){return[{id:uid(),name:'Festival Wishes',message:'Dear {{name}},\n\nWarm wishes from SHREE JI GOLD CREATOR LLP.\n\nThank you for your continued support.\n\nRegards,\nSHREE JI GOLD CREATOR LLP'},{id:uid(),name:'Order Ready',message:'Dear {{name}},\n\nYour order {{orderNo}} is ready for delivery.\nWeight: {{weight}}\n\nThank you,\nSHREE JI GOLD CREATOR LLP'},{id:uid(),name:'Order Update',message:'Dear {{name}},\n\nYour order {{orderNo}} status: {{status}}.\n\nThank you,\nSHREE JI GOLD CREATOR LLP'}]}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function money(x){return Number(x||0).toLocaleString('en-IN')}
function toast(t){let x=document.getElementById('toast');x.textContent=t;x.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>x.style.display='none',1900)}
function allOrders(){return DB.customers.flatMap(c=>(c.orders||[]).map(o=>({...o,customerId:c.id,customerName:c.name,mobile:c.mobile,shop:c.shop,place:c.place}))).sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''))}
function page(p){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));({dashboard:dashboard,customers:customersPage,orders:ordersPage,whatsapp:whatsappPage,templates:templatesPage,backup:backupPage}[p]||dashboard)()}
function dashboard(){let os=allOrders(),pending=os.filter(o=>!['Delivered','Completed'].includes(o.status)).length;document.getElementById('app').innerHTML=`<section class="card hero"><h2>Welcome to SHREE JI CONNECT 👋</h2><p class="muted">Customer Relationship & Order Management</p><div class="actions"><button class="btn gold" onclick="openCustomer()">＋ Add Customer</button><button class="btn" onclick="page('orders')">📦 New Order</button></div></section><div class="stats"><div class="stat"><b>${DB.customers.length}</b><span class="muted">Total Customers</span></div><div class="stat"><b>${os.length}</b><span class="muted">Total Orders</span></div><div class="stat"><b>${pending}</b><span class="muted">Active / Pending</span></div><div class="stat"><b>₹${money(os.reduce((s,o)=>s+Number(o.advance||0),0))}</b><span class="muted">Total Advance</span></div></div><section class="card"><h2>Recent Orders</h2>${os.length?os.slice(0,5).map(orderCard).join(''):'<div class="empty">📦<br>No orders yet.<br>Your recent orders will appear here.</div>'}</section>`}
function customersPage(){document.getElementById('app').innerHTML=`<section class="card"><div class="actions" style="justify-content:space-between"><h2 style="margin:0">👥 Customers</h2><button class="btn gold" onclick="openCustomer()">＋ Add Customer</button></div><div class="field"><input id="custSearch" class="search" placeholder="Search name, mobile, shop or place..." oninput="renderCustomers()"></div><div id="customerList"></div></section>`;renderCustomers()}
function renderCustomers(){let q=(document.getElementById('custSearch')?.value||'').toLowerCase();let a=DB.customers.filter(c=>(c.name+' '+c.mobile+' '+c.shop+' '+c.place).toLowerCase().includes(q));document.getElementById('customerList').innerHTML=a.length?a.map(c=>`<div class="customer"><h3>${esc(c.name)}</h3><div>📱 ${esc(c.mobile)}</div><div>🏪 ${esc(c.shop||'-')}</div><div>📍 ${esc(c.place||'-')}</div><div class="actions" style="margin-top:11px"><button class="btn gold small" onclick="addOrder('${c.id}')">＋ Add Order</button><button class="btn small" onclick="editCustomer('${c.id}')">✏️ Edit</button><button class="btn small green" onclick="whatsappCustomer('${c.id}')">💬 WhatsApp</button><button class="btn small" onclick="openCustomerHistory('${c.id}')">📋 History</button><button class="btn red small" onclick="deleteCustomer('${c.id}')">🗑 Delete</button></div><div class="history"><b>📦 Previous Orders (${(c.orders||[]).length})</b>${(c.orders||[]).length?(c.orders||[]).slice().reverse().map(o=>orderCard({...o,customerName:c.name,mobile:c.mobile,customerId:c.id})).join(''):'<div class="empty">No previous orders</div>'}</div></div>`).join(''):'<div class="empty">No customers found.</div>'}
function openCustomer(){document.getElementById('form').innerHTML=`<h2>Add Customer</h2><div class="field"><label>Customer Name *</label><input id="c_name" placeholder="Enter customer name"></div><div class="field"><label>Mobile No *</label><input id="c_mobile" inputmode="tel" placeholder="Enter WhatsApp number"></div><div class="grid2"><div class="field"><label>Shop Name</label><input id="c_shop" placeholder="Shop name"></div><div class="field"><label>Place</label><input id="c_place" placeholder="Place"></div></div><div class="actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn gold" onclick="saveCustomer()">Save Customer</button></div>`;showModal()}
function saveCustomer(){let name=c_name.value.trim(),mobile=c_mobile.value.trim();if(!name||!mobile)return toast('Customer Name and Mobile No are required');DB.customers.push({id:uid(),name,mobile,shop:c_shop.value.trim(),place:c_place.value.trim(),createdAt:new Date().toISOString(),orders:[]});saveDB();closeModal();page('customers');toast('Customer added successfully ✓')}
function editCustomer(id){let c=DB.customers.find(x=>x.id===id);if(!c)return;document.getElementById('form').innerHTML=`<h2>Edit Customer</h2><div class="field"><label>Customer Name *</label><input id="c_name" value="${esc(c.name)}"></div><div class="field"><label>Mobile No *</label><input id="c_mobile" value="${esc(c.mobile)}"></div><div class="grid2"><div class="field"><label>Shop Name</label><input id="c_shop" value="${esc(c.shop||'')}"></div><div class="field"><label>Place</label><input id="c_place" value="${esc(c.place||'')}"></div></div><div class="actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn gold" onclick="updateCustomer('${id}')">Save Changes</button></div>`;showModal()}
function updateCustomer(id){let c=DB.customers.find(x=>x.id===id);if(!c)return;c.name=c_name.value.trim();c.mobile=c_mobile.value.trim();c.shop=c_shop.value.trim();c.place=c_place.value.trim();if(!c.name||!c.mobile)return toast('Name and Mobile No are required');saveDB();closeModal();page('customers');toast('Customer updated ✓')}
function deleteCustomer(id){if(!confirm('Delete this customer and all previous orders?'))return;DB.customers=DB.customers.filter(c=>c.id!==id);saveDB();renderCustomers();toast('Customer deleted')}
function addOrder(cid){let c=DB.customers.find(x=>x.id===cid);orderForm(c)}
function orderForm(c,oid=null){let o=oid?(c.orders||[]).find(x=>x.id===oid):null;document.getElementById('form').innerHTML=`<h2>${o?'Edit Order':'New Order'}</h2><p><b>${esc(c.name)}</b> • ${esc(c.mobile)}</p><div class="field"><label>Order No *</label><input id="o_no" value="${esc(o?.orderNo||'')}" placeholder="Order number"></div><div class="grid2"><div class="field"><label>Weight</label><input id="o_weight" value="${esc(o?.weight||'')}" placeholder="Example: 12.500 g"></div><div class="field"><label>Gold Touch</label><input id="o_touch" value="${esc(o?.touch||'')}" placeholder="Example: 916"></div></div><div class="grid2"><div class="field"><label>Advance</label><input id="o_advance" type="number" min="0" value="${esc(o?.advance||'')}" placeholder="₹"></div><div class="field"><label>Status</label><select id="o_status">${['Pending','Processing','Ready','Delivered','Completed'].map(s=>`<option ${o?.status===s?'selected':''}>${s}</option>`).join('')}</select></div></div><div class="field"><label>Order Date</label><input id="o_date" type="date" value="${esc(o?.date||new Date().toISOString().slice(0,10))}"></div><div class="actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn gold" onclick="saveOrder('${c.id}','${oid||''}')">${o?'Update Order':'Save Order'}</button></div>`;showModal()}
function saveOrder(cid,oid){let c=DB.customers.find(x=>x.id===cid);if(!c)return;let no=o_no.value.trim();if(!no)return toast('Order No is required');let data={id:oid||uid(),orderNo:no,weight:o_weight.value.trim(),touch:o_touch.value.trim(),advance:Number(o_advance.value||0),status:o_status.value,date:o_date.value,createdAt:oid?((c.orders.find(x=>x.id===oid)||{}).createdAt||new Date().toISOString()):new Date().toISOString()};c.orders=c.orders||[];if(oid){let i=c.orders.findIndex(x=>x.id===oid);if(i>=0)c.orders[i]=data}else c.orders.push(data);saveDB();closeModal();page('customers');toast(oid?'Order updated ✓':'Order saved ✓')}
function orderCard(o){return `<div class="order"><div class="actions" style="justify-content:space-between"><b>📦 ${esc(o.orderNo||'Order')}</b><span class="pill">${esc(o.status||'Pending')}</span></div><div>👤 ${esc(o.customerName||'Customer')}</div><div>⚖️ ${esc(o.weight||'-')} &nbsp; 🪙 ${esc(o.touch||'-')}</div><div>💰 Advance: ₹${money(o.advance)} &nbsp; 📅 ${esc(o.date||'-')}</div><div class="actions" style="margin-top:8px"><button class="btn small" onclick="editOrder('${o.customerId}','${o.id}')">✏️ Edit</button><button class="btn red small" onclick="deleteOrder('${o.customerId}','${o.id}')">🗑 Delete</button></div></div>`}
function ordersPage(){let os=allOrders();document.getElementById('app').innerHTML=`<section class="card"><div class="actions" style="justify-content:space-between"><h2 style="margin:0">📦 Orders</h2><button class="btn gold" onclick="page('customers')">＋ New Order</button></div><div class="field"><input id="orderSearch" class="search" placeholder="Search order no, customer, product/status..." oninput="renderOrders()"></div><div id="ordersList"></div></section>`;renderOrders()}
function renderOrders(){let q=(document.getElementById('orderSearch')?.value||'').toLowerCase();let os=allOrders().filter(o=>(o.orderNo+' '+o.customerName+' '+o.status+' '+o.weight).toLowerCase().includes(q));document.getElementById('ordersList').innerHTML=os.length?os.map(orderCard).join(''):'<div class="empty">No orders found.</div>'}
function editOrder(cid,oid){let c=DB.customers.find(x=>x.id===cid);if(c)orderForm(c,oid)}
function deleteOrder(cid,oid){if(!confirm('Delete this order?'))return;let c=DB.customers.find(x=>x.id===cid);if(!c)return;c.orders=c.orders.filter(o=>o.id!==oid);saveDB();page('orders');toast('Order deleted')}
function openCustomerHistory(cid){let c=DB.customers.find(x=>x.id===cid);if(!c)return;document.getElementById('form').innerHTML=`<h2>📋 ${esc(c.name)} — Order History</h2><p>📱 ${esc(c.mobile)}<br>🏪 ${esc(c.shop||'-')} • 📍 ${esc(c.place||'-')}</p>${c.orders.length?c.orders.slice().reverse().map(o=>orderCard({...o,customerName:c.name,customerId:c.id,mobile:c.mobile})).join(''):'<div class="empty">No previous orders</div>'}`;showModal()}
function whatsappPage(){let pending=sessionStorage.getItem("waCustomerId")||"";sessionStorage.removeItem("waCustomerId");document.getElementById('app').innerHTML=`<section class="card"><h2>💬 WhatsApp Message</h2><div class="field"><label>Select Customer</label><select id="wa_customer" onchange="loadWAForCustomer(this.value)"><option value="">— Select customer —</option>${DB.customers.map(c=>`<option value="${c.id}" ${c.id===pending?"selected":""}>${esc(c.name)} — ${esc(c.mobile)}</option>`).join("")}</select></div><div class="field"><label>WhatsApp Number</label><input id="wa_phone" inputmode="tel" placeholder="Select a customer or enter number manually"></div><div class="field"><label>Message</label><textarea id="wa_message" placeholder="Type your message..."></textarea></div><button class="btn green" onclick="openWhatsApp()">💬 Open WhatsApp</button></section><section class="card"><h2>🖼️ WhatsApp Image</h2><p class="muted">Select an image to share manually through WhatsApp.</p><input id="wa_image" type="file" accept="image/*"><br><br><button class="btn" onclick="shareImage()">🖼️ Share Image</button></section><section class="card"><h2>📣 Bulk WhatsApp</h2><p class="muted">Select customers, choose a template, preview messages, then open chats one by one.</p><div class="actions"><button class="btn" onclick="selectAllWA(true)">Select All</button><button class="btn" onclick="selectAllWA(false)">Clear</button></div><div class="field"><label>Message Template</label><select id="bulkTemplate" onchange="setBulkPreview()">${DB.templates.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select></div><div id="bulkCustomers"></div><h3>Preview</h3><div id="bulkPreview" class="preview">Select customers.</div><br><button class="btn green" onclick="bulkWhatsApp()">💬 Start WhatsApp</button></section>`;renderBulkCustomers();setBulkPreview();if(pending)loadWAForCustomer(pending)}
function normalizePhone(p){let n=String(p||'').replace(/\D/g,'');if(n.length===10)n='91'+n;return n}
function whatsappCustomer(id){sessionStorage.setItem("waCustomerId",id);page("whatsapp")}
function loadWAForCustomer(id){let c=DB.customers.find(x=>x.id===id);if(!c)return;if(typeof wa_phone!=="undefined")wa_phone.value=c.mobile||"";let o=(c.orders||[]).slice(-1)[0],t=DB.templates[0];if(t&&typeof wa_message!=="undefined")wa_message.value=applyTemplate(t.message,c,o)}
function openWhatsApp(){let n=normalizePhone(wa_phone.value),m=wa_message.value.trim();if(!n)return toast('Select a customer or enter WhatsApp number');if(!m)return toast('Enter a message');window.open('https://wa.me/'+n+'?text='+encodeURIComponent(m),'_blank')}

async function shareImage(){let f=wa_image.files?.[0];if(!f)return toast('Please select an image');if(navigator.share&&navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({title:'SHREE JI CONNECT',text:'SHREE JI GOLD CREATOR LLP',files:[f]});toast('Share opened ✓')}catch(e){}return}toast('Direct image sharing is not supported here. Use WhatsApp attachment manually.')}
function renderBulkCustomers(){let box=document.getElementById('bulkCustomers');if(!box)return;box.innerHTML=DB.customers.length?DB.customers.map(c=>`<label class="checkrow"><input class="bulkCheck" type="checkbox" value="${c.id}" onchange="setBulkPreview()"><span>👤 <b>${esc(c.name)}</b> — ${esc(c.mobile)} ${c.shop?'• '+esc(c.shop):''}</span></label>`).join(''):'<div class="empty">Add customers first.</div>'}
function selectAllWA(v){document.querySelectorAll('.bulkCheck').forEach(x=>x.checked=v);setBulkPreview()}
function getTemplate(id){return DB.templates.find(t=>t.id===id)}
function applyTemplate(msg,c,o){return String(msg||'').replaceAll('{{name}}',c?.name||'').replaceAll('{{phone}}',c?.mobile||'').replaceAll('{{company}}','SHREE JI GOLD CREATOR LLP').replaceAll('{{orderNo}}',o?.orderNo||'').replaceAll('{{weight}}',o?.weight||'').replaceAll('{{touch}}',o?.touch||'').replaceAll('{{advance}}',money(o?.advance||0)).replaceAll('{{status}}',o?.status||'').replaceAll('{{date}}',o?.date||'')}
function setBulkPreview(){let p=document.getElementById('bulkPreview');if(!p)return;let t=getTemplate(document.getElementById('bulkTemplate')?.value),ids=[...document.querySelectorAll('.bulkCheck:checked')].map(x=>x.value);if(!ids.length){p.textContent='Select customers.';return}p.innerHTML=ids.map(id=>{let c=DB.customers.find(x=>x.id===id),o=(c.orders||[]).slice(-1)[0];return `<b>${esc(c.name)}</b>\n${esc(applyTemplate(t?.message||'',c,o))}`}).join('\n\n──────────\n\n')}
function bulkWhatsApp(){let t=getTemplate(document.getElementById('bulkTemplate')?.value),ids=[...document.querySelectorAll('.bulkCheck:checked')].map(x=>x.value);if(!ids.length)return toast('Select customers first');ids.forEach((id,i)=>{let c=DB.customers.find(x=>x.id===id),o=(c.orders||[]).slice(-1)[0],url='https://wa.me/'+normalizePhone(c.mobile)+'?text='+encodeURIComponent(applyTemplate(t?.message||'',c,o));setTimeout(()=>window.open(url,'_blank'),i*700)});toast('WhatsApp chats opened')}
function templatesPage(){document.getElementById('app').innerHTML=`<section class="card"><div class="actions" style="justify-content:space-between"><h2 style="margin:0">📝 Message Templates</h2><button class="btn green" onclick="addTemplate()">＋ New Template</button></div><p class="muted">Available placeholders: {{name}}, {{phone}}, {{company}}, {{orderNo}}, {{weight}}, {{touch}}, {{advance}}, {{status}}, {{date}}</p><div id="templateList"></div></section>`;renderTemplates()}
function renderTemplates(){let b=document.getElementById('templateList');if(!b)return;b.innerHTML=DB.templates.length?DB.templates.map(t=>`<div class="template"><h3>📝 ${esc(t.name)}</h3><div class="preview">${esc(t.message)}</div><div class="actions" style="margin-top:10px"><button class="btn small" onclick="editTemplate('${t.id}')">✏️ Edit</button><button class="btn red small" onclick="deleteTemplate('${t.id}')">🗑 Delete</button></div></div>`).join(''):'<div class="empty">No templates yet.</div>'}
function addTemplate(tid=null){let t=tid?DB.templates.find(x=>x.id===tid):null;document.getElementById('form').innerHTML=`<h2>${t?'Edit Template':'Create Template'}</h2><div class="field"><label>Template Name</label><input id="t_name" value="${esc(t?.name||'')}" placeholder="Example: Festival Wishes"></div><div class="field"><label>Message</label><textarea id="t_message" placeholder="Dear {{name}},\n\nYour message..."></textarea></div>${t?'': ''}<div class="actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn green" onclick="saveTemplate('${tid||''}')">Save Template</button></div>`;if(t)t_message.value=t.message;showModal()}
function saveTemplate(id){let name=t_name.value.trim(),message=t_message.value;if(!name||!message)return toast('Template name and message are required');if(id){let t=DB.templates.find(x=>x.id===id);t.name=name;t.message=message}else DB.templates.push({id:uid(),name,message});saveDB();closeModal();page('templates');toast('Template saved ✓')}
function editTemplate(id){addTemplate(id)}
function deleteTemplate(id){if(!confirm('Delete this template?'))return;DB.templates=DB.templates.filter(t=>t.id!==id);saveDB();renderTemplates();toast('Template deleted')}
function backupPage(){document.getElementById('app').innerHTML=`<section class="card"><h2>💾 Backup & Restore</h2><p>Export your customers, orders and templates as a JSON backup. Keep it somewhere safe. You can import it later on this or another browser.</p><div class="actions"><button class="btn green" onclick="exportBackup()">⬇️ Export Backup</button><label class="btn" style="cursor:pointer">⬆️ Import Backup<input id="importFile" type="file" accept="application/json" hidden onchange="importBackup(event)"></label></div></section><section class="card"><h2>📊 Data Summary</h2><div class="grid3"><div><b>${DB.customers.length}</b><br><span class="muted">Customers</span></div><div><b>${allOrders().length}</b><br><span class="muted">Orders</span></div><div><b>${DB.templates.length}</b><br><span class="muted">Templates</span></div></div></section><section class="card"><h2>⚠️ Reset</h2><p class="muted">This permanently clears data stored in this browser. Export a backup first.</p><button class="btn red" onclick="resetData()">Reset All Data</button></section>`}
function exportBackup(){let blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='shree-ji-connect-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href);toast('Backup downloaded ✓')}
function importBackup(e){let f=e.target.files?.[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d.customers||!d.templates)throw Error();if(!confirm('Replace current data with this backup?'))return;DB=d;saveDB();page('dashboard');toast('Backup restored ✓')}catch(x){toast('Invalid backup file')}};r.readAsText(f)}
function resetData(){if(!confirm('Reset ALL customers, orders and templates?'))return;DB={customers:[],templates:defaultTemplates(),orders:[]};saveDB();page('dashboard');toast('All data reset')}
function showModal(){document.getElementById('modal').classList.add('show')};function closeModal(){document.getElementById('modal').classList.remove('show')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});setInterval(()=>{try{saveDB()}catch(e){}},30000);page('dashboard');
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
