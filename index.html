<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111111">
<title>SHREE JI CONNECT</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f6f8;
  color:#171717;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0}

:root{
  --gold:#c59b45;
  --gold2:#e3c477;
  --dark:#111111;
  --dark2:#1b1b1b;
  --white:#fff;
  --muted:#747474;
  --green:#159447;
  --red:#d64545;
  --blue:#3768d8;
}

.app{min-height:100vh}

.top{
  height:72px;
  background:linear-gradient(135deg,#101010,#242424);
  color:white;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
  position:sticky;
  top:0;
  z-index:20;
  box-shadow:0 4px 18px #0002;
}

.logo{
  display:flex;
  align-items:center;
  gap:12px;
}
.logoCircle{
  width:43px;height:43px;border-radius:50%;
  background:linear-gradient(135deg,var(--gold),var(--gold2));
  color:#111;
  display:flex;align-items:center;justify-content:center;
  font-weight:900;
  font-size:17px;
}
.logoTitle{font-size:18px;font-weight:800;letter-spacing:.4px}
.logoSub{font-size:10px;color:#d7d7d7;margin-top:3px}

.topRight{display:flex;align-items:center;gap:10px}
.topBtn{
  width:40px;height:40px;border-radius:12px;
  background:#ffffff12;color:white;
}
.avatar{
  width:40px;height:40px;border-radius:50%;
  background:var(--gold);font-weight:bold;
}

.layout{display:flex;min-height:calc(100vh - 72px)}

.side{
  width:245px;background:#fff;
  border-right:1px solid #e5e5e5;
  padding:18px 12px;
  flex-shrink:0;
}

.nav{
  width:100%;padding:13px 14px;
  border-radius:12px;background:none;
  text-align:left;color:#555;
  margin-bottom:5px;
  font-weight:600;
}
.nav:hover,.nav.active{
  background:#fff5df;color:#8c651d;
}
.nav.active{box-shadow:inset 3px 0 var(--gold)}

.main{flex:1;padding:25px;max-width:1500px}

.pageTitle{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:22px;
}
.pageTitle h1{font-size:27px}
.pageTitle p{color:var(--muted);margin-top:5px;font-size:13px}

.primary{
  background:linear-gradient(135deg,var(--gold),#a77b29);
  color:white;padding:12px 17px;border-radius:11px;
  font-weight:bold;box-shadow:0 5px 15px #b88b3b33;
}
.secondary{
  background:#fff;border:1px solid #ddd;
  padding:11px 15px;border-radius:10px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;margin-bottom:22px;
}
.card{
  background:white;border-radius:16px;padding:19px;
  border:1px solid #e9e9e9;
  box-shadow:0 4px 15px #00000008;
}
.stat{
  display:flex;justify-content:space-between;align-items:center;
}
.statIcon{
  width:45px;height:45px;border-radius:13px;
  display:flex;align-items:center;justify-content:center;
  background:#fff3d9;font-size:21px;
}
.stat h2{font-size:28px;margin-top:9px}
.stat p{color:#777;font-size:12px}
.goldText{color:#a87924}

.grid2{
  display:grid;grid-template-columns:1.4fr 1fr;gap:18px;
}
.sectionTitle{
  font-size:17px;font-weight:800;margin-bottom:14px;
  display:flex;justify-content:space-between;align-items:center;
}

.tableWrap{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:600px}
th,td{text-align:left;padding:13px 10px;border-bottom:1px solid #eee;font-size:13px}
th{color:#777;font-size:11px;text-transform:uppercase}

.badge{
  display:inline-block;padding:6px 9px;border-radius:20px;
  font-size:11px;font-weight:bold;
}
.new{background:#edf2ff;color:#3862c7}
.started{background:#fff2d9;color:#9b6a17}
.completed{background:#e9f8ef;color:#168144}
.pending{background:#fff0f0;color:#c33}
.delivered{background:#e7f7ee;color:#168144}

.quick{
  display:grid;grid-template-columns:repeat(2,1fr);gap:10px;
}
.quick button{
  background:#fafafa;border:1px solid #eee;
  border-radius:12px;padding:14px;text-align:left;
  font-weight:700;
}
.quick button:hover{border-color:var(--gold);background:#fffaf0}

.search{
  width:100%;padding:13px 15px;border:1px solid #ddd;
  border-radius:11px;outline:none;background:white;
  margin-bottom:15px;
}
.search:focus{border-color:var(--gold)}

.customerGrid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:15px;
}
.customer{
  background:#fff;border:1px solid #e7e7e7;
  border-radius:15px;padding:17px;
}
.customerTop{display:flex;gap:12px;align-items:center}
.cAvatar{
  width:45px;height:45px;border-radius:50%;
  background:#fff0d0;color:#8e651c;
  display:flex;align-items:center;justify-content:center;
  font-weight:bold;
}
.customer h3{font-size:15px}
.customer small{color:#777}
.customerActions{display:flex;gap:7px;margin-top:15px}
.whatsapp{background:#20b85a;color:#fff;padding:9px 11px;border-radius:9px;font-weight:bold}
.view{background:#f3f3f3;padding:9px 11px;border-radius:9px}

.templateGrid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:14px;
}
.template{
  background:white;border:1px solid #e7e7e7;
  border-radius:15px;padding:17px;
}
.templateIcon{font-size:25px;margin-bottom:10px}
.template h3{font-size:15px}
.template p{font-size:12px;color:#777;margin:7px 0 13px;line-height:1.5}

.timeline{position:relative}
.timelineItem{
  display:flex;gap:13px;padding:0 0 18px;
}
.dot{
  width:11px;height:11px;background:var(--gold);
  border-radius:50%;margin-top:4px;flex-shrink:0;
}
.timelineItem h4{font-size:13px}
.timelineItem p{font-size:12px;color:#777;margin-top:3px}

.progress{
  height:9px;background:#eee;border-radius:10px;overflow:hidden;
}
.progress span{
  display:block;height:100%;
  background:linear-gradient(90deg,var(--gold),var(--gold2));
}

.empty{
  text-align:center;padding:35px;color:#888;
}

.modal{
  position:fixed;inset:0;background:#0008;
  display:none;align-items:center;justify-content:center;
  z-index:50;padding:18px;
}
.modal.show{display:flex}
.modalBox{
  width:100%;max-width:560px;background:white;
  border-radius:18px;padding:22px;
  max-height:90vh;overflow:auto;
}
.modalHead{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:18px;
}
.close{background:#f2f2f2;width:35px;height:35px;border-radius:50%;font-size:20px}
.formGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{margin-bottom:12px}
.field.full{grid-column:1/-1}
.field label{display:block;font-size:12px;font-weight:bold;margin-bottom:6px}
.field input,.field select,.field textarea{
  width:100%;padding:12px;border:1px solid #ddd;
  border-radius:9px;outline:none;
}
.field textarea{min-height:90px;resize:vertical}
.modalActions{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}

.toast{
  position:fixed;bottom:20px;left:50%;
  transform:translateX(-50%) translateY(80px);
  background:#171717;color:#fff;padding:12px 18px;
  border-radius:10px;z-index:100;
  transition:.3s;opacity:0;
}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

.mobileMenu{display:none}

@media(max-width:1000px){
  .cards{grid-template-columns:repeat(2,1fr)}
  .customerGrid{grid-template-columns:repeat(2,1fr)}
  .templateGrid{grid-template-columns:repeat(2,1fr)}
  .grid2{grid-template-columns:1fr}
}
@media(max-width:700px){
  .top{height:64px;padding:0 13px}
  .logoTitle{font-size:14px}
  .logoSub{font-size:8px}
  .side{
    position:fixed;left:-260px;top:64px;bottom:0;
    z-index:30;transition:.3s;
  }
  .side.open{left:0}
  .mobileMenu{display:block;background:none;color:white;font-size:22px}
  .main{padding:15px}
  .cards{grid-template-columns:1fr 1fr;gap:9px}
  .card{padding:13px}
  .stat h2{font-size:22px}
  .statIcon{width:38px;height:38px}
  .pageTitle{align-items:flex-start;gap:10px}
  .pageTitle h1{font-size:22px}
  .customerGrid,.templateGrid{grid-template-columns:1fr}
  .formGrid{grid-template-columns:1fr}
  .field.full{grid-column:auto}
}
</style>
</head>

<body>

<div class="app">

<header class="top">
  <div class="logo">
    <button class="mobileMenu" onclick="toggleMenu()">☰</button>
    <div class="logoCircle">SJ</div>
    <div>
      <div class="logoTitle">SHREE JI CONNECT</div>
      <div class="logoSub">SHREE JI GOLD CREATOR LLP</div>
    </div>
  </div>

  <div class="topRight">
    <button class="topBtn" onclick="showToast('No new notifications')"></button>
    <button class="avatar">SJ</button>
  </div>
</header>

<div class="layout">

<aside class="side" id="side">
  <button class="nav active" onclick="page('dashboard',this)"> Dashboard</button>
  <button class="nav" onclick="page('customers',this)"> Customers</button>
  <button class="nav" onclick="page('orders',this)"> Orders</button>
  <button class="nav" onclick="page('whatsapp',this)"> WhatsApp Center</button>
  <button class="nav" onclick="page('exhibitions',this)"> Exhibitions</button>
  <button class="nav" onclick="page('reviews',this)">⭐ Reviews</button>
  <button class="nav" onclick="page('reports',this)"> Reports</button>
  <button class="nav" onclick="page('settings',this)">⚙️ Settings</button>
</aside>

<main class="main" id="main"></main>

</div>
</div>

<div class="modal" id="modal">
  <div class="modalBox">
    <div class="modalHead">
      <h2 id="modalTitle">Add</h2>
      <button class="close" onclick="closeModal()">×</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================
   SHREE JI CONNECT
   Local business prototype
========================= */

let customers = JSON.parse(localStorage.getItem("sj_customers") || "[]");
let orders = JSON.parse(localStorage.getItem("sj_orders") || "[]");
let reviews = JSON.parse(localStorage.getItem("sj_reviews") || "[]");
let exhibitions = JSON.parse(localStorage.getItem("sj_exhibitions") || "[]");

function save(){
  localStorage.setItem("sj_customers",JSON.stringify(customers));
  localStorage.setItem("sj_orders",JSON.stringify(orders));
  localStorage.setItem("sj_reviews",JSON.stringify(reviews));
  localStorage.setItem("sj_exhibitions",JSON.stringify(exhibitions));
}

function showToast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),2500);
}

function toggleMenu(){
  document.getElementById("side").classList.toggle("open");
}

function page(name,el){
  document.querySelectorAll(".nav").forEach(x=>x.classList.remove("active"));
  if(el)el.classList.add("active");
  document.getElementById("side").classList.remove("open");

  if(name==="dashboard")dashboard();
  if(name==="customers")customerPage();
  if(name==="orders")orderPage();
  if(name==="whatsapp")whatsappPage();
  if(name==="exhibitions")exhibitionPage();
  if(name==="reviews")reviewPage();
  if(name==="reports")reportPage();
  if(name==="settings")settingsPage();
}

function dashboard(){

  const active=orders.filter(o=>!["Delivered","Completed"].includes(o.status)).length;
  const completed=orders.filter(o=>["Completed","Delivered"].includes(o.status)).length;
  const pending=orders.filter(o=>o.status==="Ready for Delivery").length;
  const value=orders.reduce((s,o)=>s+(Number(o.value)||0),0);

  document.getElementById("main").innerHTML=`
  <div class="pageTitle">
    <div>
      <h1>Good Morning </h1>
      <p>Business overview — SHREE JI GOLD CREATOR LLP</p>
    </div>
    <button class="primary" onclick="openCustomer()">＋ Add Customer</button>
  </div>

  <div class="cards">
    <div class="card stat">
      <div><p>Total Customers</p><h2>${customers.length}</h2></div>
      <div class="statIcon"></div>
    </div>

    <div class="card stat">
      <div><p>Active Orders</p><h2>${active}</h2></div>
      <div class="statIcon"></div>
    </div>

    <div class="card stat">
      <div><p>Pending Delivery</p><h2>${pending}</h2></div>
      <div class="statIcon"></div>
    </div>

    <div class="card stat">
      <div><p>Total Order Value</p><h2 class="goldText">₹${value.toLocaleString("en-IN")}</h2></div>
      <div class="statIcon"></div>
    </div>
  </div>

  <div class="grid2">

    <div class="card">
      <div class="sectionTitle">
        Recent Orders
        <button class="secondary" onclick="page('orders')">View All</button>
      </div>

      ${orders.length===0
      ? `<div class="empty"><br><br>No orders yet.<br>Add your first order.</div>`
      : `<div class="tableWrap"><table>
      <thead><tr><th>Order</th><th>Customer</th><th>Status</th><th>Value</th></tr></thead>
      <tbody>
      ${orders.slice(-6).reverse().map(o=>`
      <tr>
        <td><b>${o.number}</b></td>
        <td>${o.customer}</td>
        <td><span class="badge ${statusClass(o.status)}">${o.status}</span></td>
        <td>₹${Number(o.value||0).toLocaleString("en-IN")}</td>
      </tr>`).join("")}
      </tbody></table></div>`}
    </div>

    <div class="card">
      <div class="sectionTitle">Quick Actions</div>

      <div class="quick">
        <button onclick="openCustomer()"><br>Add Customer</button>
        <button onclick="openOrder()"><br>New Order</button>
        <button onclick="page('whatsapp')"><br>WhatsApp</button>
        <button onclick="openExhibition()"><br>Exhibition</button>
        <button onclick="page('reviews')">⭐<br>Reviews</button>
        <button onclick="page('reports')"><br>Reports</button>
      </div>

      <br>

      <div class="sectionTitle">Business Health</div>
      <p style="font-size:12px;color:#777;margin-bottom:7px">Completed Orders</p>
      <div class="progress"><span style="width:${orders.length ? Math.min(100,completed/orders.length*100):0}%"></span></div>
      <p style="font-size:11px;color:#888;margin-top:6px">${completed} completed of ${orders.length} orders</p>
    </div>

  </div>
  `;
}

function statusClass(s){
  if(s==="New")return "new";
  if(s==="Started"||s==="Production")return "started";
  if(s==="Completed")return "completed";
  if(s==="Delivered")return "delivered";
  return "pending";
}

function customerPage(){

 document.getElementById("main").innerHTML=`
 <div class="pageTitle">
  <div><h1>Customers</h1><p>Manage your customer relationships</p></div>
  <button class="primary" onclick="openCustomer()">＋ Add Customer</button>
 </div>

 <input class="search" id="customerSearch" placeholder=" Search customer, shop or WhatsApp number..." oninput="renderCustomers()">

 <div class="customerGrid" id="customerList"></div>
 `;

 renderCustomers();
}

function renderCustomers(){

 const q=(document.getElementById("customerSearch")?.value||"").toLowerCase();

 const list=customers.filter(c=>
  c.name.toLowerCase().includes(q) ||
  (c.shop||"").toLowerCase().includes(q) ||
  (c.phone||"").includes(q)
 );

 const box=document.getElementById("customerList");

 if(!box)return;

 if(!list.length){
  box.innerHTML=`<div class="card empty" style="grid-column:1/-1"><br><br>No customers found.<br>Add a customer to get started.</div>`;
  return;
 }

 box.innerHTML=list.map(c=>`
 <div class="customer">
  <div class="customerTop">
   <div class="cAvatar">${initials(c.name)}</div>
   <div>
    <h3>${esc(c.name)}</h3>
    <small>${esc(c.shop||"Individual Customer")}</small>
   </div>
  </div>

  <div style="margin-top:13px;font-size:12px;color:#666">
    ${esc(c.phone)}<br>
    ${esc(c.city||"City not added")}<br>
    ${orders.filter(o=>o.customerPhone===c.phone).length} orders
  </div>

  <div class="customerActions">
   <button class="whatsapp" onclick="sendWA('${encodeURIComponent(c.phone)}','${encodeURIComponent(c.name)}')"> WhatsApp</button>
   <button class="view" onclick="customerDetails('${encodeURIComponent(c.phone)}')">View</button>
  </div>
 </div>
 `).join("");
}

function initials(name){
 return name.split(" ").map(x=>x[0]).slice(0,2).join("").toUpperCase();
}

function esc(x){
 return String(x||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}

function openCustomer(){

 document.getElementById("modalTitle").textContent="Add New Customer";

 document.getElementById("modalBody").innerHTML=`
 <div class="formGrid">

 <div class="field">
  <label>Customer Name *</label>
  <input id="cName" placeholder="Enter name">
 </div>

 <div class="field">
  <label>WhatsApp Number *</label>
  <input id="cPhone" type="tel" placeholder="10 digit number">
 </div>

 <div class="field">
  <label>Shop / Company</label>
  <input id="cShop" placeholder="Shop name">
 </div>

 <div class="field">
  <label>City</label>
  <input id="cCity" placeholder="City">
 </div>

 <div class="field full">
  <label>Notes</label>
  <textarea id="cNotes" placeholder="Customer notes"></textarea>
 </div>

 </div>

 <div class="modalActions">
  <button class="secondary" onclick="closeModal()">Cancel</button>
  <button class="primary" onclick="addCustomer()">Save Customer</button>
 </div>
 `;

 openModal();
}

function addCustomer(){

 const name=document.getElementById("cName").value.trim();
 const phone=document.getElementById("cPhone").value.trim();

 if(!name||!phone){
  showToast("Please enter name and WhatsApp number");
  return;
 }

 customers.push({
  id:Date.now(),
  name,
  phone,
  shop:document.getElementById("cShop").value.trim(),
  city:document.getElementById("cCity").value.trim(),
  notes:document.getElementById("cNotes").value.trim(),
  created:new Date().toLocaleDateString()
 });

 save();
 closeModal();
 customerPage();
 showToast("Customer added successfully ✓");
}

function customerDetails(encoded){

 const phone=decodeURIComponent(encoded);
 const c=customers.find(x=>x.phone===phone);

 if(!c)return;

 const os=orders.filter(o=>o.customerPhone===phone);

 document.getElementById("modalTitle").textContent=c.name;

 document.getElementById("modalBody").innerHTML=`
 <div class="card" style="box-shadow:none">
  <b> ${c.phone}</b><br>
  <span style="color:#777">${c.shop||"No shop name"} • ${c.city||"No city"}</span>
  <br><br>
  ${c.notes||"No notes"}
 </div>

 <br>
 <h3 style="margin-bottom:12px">Customer Timeline</h3>

 <div class="timeline">

  <div class="timelineItem">
   <div class="dot"></div>
   <div><h4>Customer Added</h4><p>${c.created}</p></div>
  </div>

  ${os.map(o=>`
   <div class="timelineItem">
    <div class="dot"></div>
    <div>
     <h4>Order ${o.number} — ${o.status}</h4>
     <p>Started: ${o.start||"-"} • Finish: ${o.finish||"-"} • Delivery: ${o.delivery||"-"}</p>
    </div>
   </div>
  `).join("")}

 </div>

 <div class="modalActions">
  <button class="whatsapp" onclick="sendWA('${encodeURIComponent(c.phone)}','${encodeURIComponent(c.name)}')"> WhatsApp</button>
  <button class="secondary" onclick="closeModal()">Close</button>
 </div>
 `;

 openModal();
}

function sendWA(phone,name){

 phone=decodeURIComponent(phone);
 name=decodeURIComponent(name);

 let clean=phone.replace(/\D/g,"");

 if(clean.length===10)clean="91"+clean;

 const msg=
 `Dear ${name},%0A%0A`+
 `Greetings from SHREE JI GOLD CREATOR LLP.%0A%0A`+
 `Thank you for being our valued customer.%0A%0A`+
 `Regards,%0A`+
 `SHREE JI GOLD CREATOR LLP`;

 window.open("https://wa.me/"+clean+"?text="+msg,"_blank");
}

function orderPage(){

 document.getElementById("main").innerHTML=`
 <div class="pageTitle">
  <div><h1>Orders</h1><p>Track every order from start to delivery</p></div>
  <button class="primary" onclick="openOrder()">＋ New Order</button>
 </div>

 <div class="card">
  <div class="tableWrap">
  <table>
   <thead>
    <tr>
     <th>Order</th><th>Customer</th><th>Item</th>
     <th>Start</th><th>Finish</th><th>Delivery</th>
     <th>Status</th><th>Value</th>
    </tr>
   </thead>
   <tbody>

   ${orders.length===0
   ? `<tr><td colspan="8" class="empty">No orders yet.</td></tr>`
   : orders.slice().reverse().map(o=>`
   <tr>
    <td><b>${o.number}</b></td>
    <td>${esc(o.customer)}</td>
    <td>${esc(o.item)}</td>
    <td>${o.start||"-"}</td>
    <td>${o.finish||"-"}</td>
    <td>${o.delivery||"-"}</td>
    <td>
     <select onchange="updateOrder('${o.id}',this.value)" style="border:0;background:#fff">
      ${["New","Started","Production","Completed","Hallmarking","Ready for Delivery","Delivered"].map(s=>`<option ${s===o.status?"selected":""}>${s}</option>`).join("")}
     </select>
    </td>
    <td>₹${Number(o.value||0).toLocaleString("en-IN")}</td>
   </tr>
   `).join("")}

   </tbody>
  </table>
  </div>
 </div>
 `;
}

function openOrder(){

 document.getElementById("modalTitle").textContent="Create New Order";

 document.getElementById("modalBody").innerHTML=`
 <div class="formGrid">

 <div class="field">
  <label>Customer *</label>
  <select id="oCustomer">
   <option value="">Select customer</option>
   ${customers.map(c=>`<option value="${esc(c.phone)}">${esc(c.name)} — ${esc(c.phone)}</option>`).join("")}
  </select>
 </div>

 <div class="field">

function addOrder(){

 const phone=document.getElementById("oCustomer").value;

 if(!phone){
  showToast("Select a customer first");
  return;
 }

 const c=customers.find(x=>x.phone===phone);

 const number="SJ-"+new Date().getFullYear()+"-"+String(orders.length+1).padStart(4,"0");

 orders.push({
  id:Date.now(),
  number,
  customer:c.name,
  customerPhone:phone,
  item:document.getElementById("oItem").value,
  weight:document.getElementById("oWeight").value,
  touch:document.getElementById("oTouch").value,
  screw:document.getElementById("oScrew").value,
  value:Number(document.getElementById("oValue").value)||0,
  advance:Number(document.getElementById("oAdvance").value)||0,
  start:document.getElementById("oStart").value,
  finish:document.getElementById("oFinish").value,
  delivery:document.getElementById("oDelivery").value,
  status:"New",
  notes:document.getElementById("oNotes").value
 });

 save();
 closeModal();
 orderPage();
 showToast("Order "+number+" created ✓");
}

function updateOrder(id,status){

 const o=orders.find(x=>x.id==id);
 if(!o)return;

 o.status=status;

 if(status==="Completed" && !o.finish)
  o.finish=new Date().toISOString().split("T")[0];

 if(status==="Delivered" && !o.delivery)
  o.delivery=new Date().toISOString().split("T")[0];

 save();
 showToast("Order status updated ✓");
 orderPage();
}
