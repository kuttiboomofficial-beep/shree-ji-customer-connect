<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111">
<title>SHREE JI CONNECT</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#171717}.top{background:#111;color:#fff;padding:16px;display:flex;align-items:center;gap:12px}.logo{width:44px;height:44px;border-radius:50%;background:#d2ad5c;color:#111;display:grid;place-items:center;font-weight:bold}.top h1{font-size:19px;margin:0}.top small{color:#ccc}.wrap{max-width:900px;margin:auto;padding:20px 14px}.card{background:#fff;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 2px 10px #0001}.btn{border:0;border-radius:12px;padding:12px 16px;background:#eee;font-weight:bold}.gold{background:#c9a44d;color:#fff}.field{margin:12px 0}.field label{display:block;font-weight:bold;margin-bottom:7px}.field input,.field select{width:100%;padding:13px;border:1px solid #ddd;border-radius:11px;font-size:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.history{border-top:1px solid #eee;margin-top:14px;padding-top:14px}.order{border:1px solid #eee;border-radius:12px;padding:12px;margin:8px 0}.pill{padding:5px 9px;border-radius:20px;background:#eee;font-size:12px}.modal{display:none;position:fixed;inset:0;background:#0008;align-items:flex-end;z-index:5}.modal.show{display:flex}.box{background:#fff;width:100%;max-width:650px;margin:auto;padding:20px;border-radius:22px 22px 0 0;max-height:92vh;overflow:auto}.close{float:right;border:0;border-radius:50%;width:34px;height:34px}.empty{text-align:center;color:#888;padding:25px}.toast{display:none;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:12px 18px;border-radius:10px;z-index:20}
@media(max-width:600px){.grid{grid-template-columns:1fr}.top h1{font-size:17px}}
</style>
</head>
<body>
<header class="top"><div class="logo">SJ</div><div><h1>SHREE JI CONNECT</h1><small>SHREE JI GOLD CREATOR LLP</small></div></header>
<div class="wrap">
<section class="card">
<h2>Customer & Order Management</h2>
<p>Add a customer and keep their previous order history in one place.</p>
<button class="btn gold" onclick="openCustomer()">＋ Add Customer</button>
</section>
<section class="card">
<h3>Customers</h3>
<input id="search" class="field" style="padding:13px;width:100%;border:1px solid #ddd;border-radius:11px" placeholder="Search customer..." oninput="render()">
<div id="list"></div>
</section>
</div>

<div id="modal" class="modal"><div class="box"><button class="close" onclick="closeModal()">×</button><div id="form"></div></div></div>
<div id="toast" class="toast"></div>

<script>
const KEY='sj_clean_v1';
let customers=JSON.parse(localStorage.getItem(KEY)||'[]');
function save(){localStorage.setItem(KEY,JSON.stringify(customers))}
function uid(){return Date.now()+Math.random().toString(16).slice(2)}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function toast(t){let x=document.getElementById('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',1800)}
function openCustomer(){
document.getElementById('form').innerHTML=`<h2>Add Customer</h2>
<div class="field"><label>Customer Name *</label><input id="name" placeholder="Customer name"></div>
<div class="field"><label>Mobile No *</label><input id="mobile" inputmode="tel" placeholder="Mobile number"></div>
<div class="field"><label>Shop Name</label><input id="shop" placeholder="Shop name"></div>
<div class="field"><label>Place</label><input id="place" placeholder="Place"></div>
<button class="btn gold" onclick="saveCustomer()">Save Customer</button>`;
document.getElementById('modal').classList.add('show')
}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function saveCustomer(){
let name=document.getElementById('name').value.trim(),mobile=document.getElementById('mobile').value.trim();
if(!name||!mobile){toast('Customer Name and Mobile No are required');return}
customers.push({id:uid(),name,mobile,shop:document.getElementById('shop').value.trim(),place:document.getElementById('place').value.trim(),orders:[]});
save();closeModal();render();toast('Customer saved ✓')
}
function render(){
let q=(document.getElementById('search')?.value||'').toLowerCase();
let a=customers.filter(c=>(c.name+' '+c.mobile+' '+c.shop+' '+c.place).toLowerCase().includes(q));
document.getElementById('list').innerHTML=a.length?a.map(c=>`
<div class="card">
<h3>${esc(c.name)}</h3><div>📱 ${esc(c.mobile)}</div><div>🏪 ${esc(c.shop||'-')}</div><div>📍 ${esc(c.place||'-')}</div>
<div style="margin-top:12px"><button class="btn gold" onclick="addOrder('${c.id}')">＋ Add Order</button></div>
<div class="history"><b>📦 Previous Orders (${c.orders.length})</b>
${c.orders.length?c.orders.slice().reverse().map(o=>`<div class="order"><b>${esc(o.orderNo)}</b> — ${esc(o.weight)}<br>Gold Touch: ${esc(o.touch)}<br>Advance: ₹${esc(o.advance)}<br>Status: <span class="pill">${esc(o.status)}</span><br>Order Date: ${esc(o.date)}</div>`).join(''):'<div class="empty">No previous orders</div>'}
</div></div>`).join(''):'<div class="empty">No customers yet.</div>'
}
function addOrder(cid){
let c=customers.find(x=>x.id===cid);if(!c)return;
document.getElementById('form').innerHTML=`<h2>New Order</h2><p><b>${esc(c.name)}</b> — ${esc(c.mobile)}</p>
<div class="field"><label>Order No *</label><input id="ono" placeholder="Order number"></div>
<div class="grid"><div class="field"><label>Weight</label><input id="weight" placeholder="Example: 12.500 g"></div>
<div class="field"><label>Gold Touch</label><input id="touch" placeholder="Example: 916"></div></div>
<div class="grid"><div class="field"><label>Advance</label><input id="advance" type="number" min="0" placeholder="₹"></div>
<div class="field"><label>Status</label><select id="status"><option>Pending</option><option>Processing</option><option>Ready</option><option>Delivered</option></select></div></div>
<div class="field"><label>Order Date</label><input id="date" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
<button class="btn gold" onclick="saveOrder('${c.id}')">Save Order</button>`;
document.getElementById('modal').classList.add('show')
}
function saveOrder(cid){
let c=customers.find(x=>x.id===cid),ono=document.getElementById('ono').value.trim();
if(!ono){toast('Order No is required');return}
c.orders.push({orderNo:ono,weight:document.getElementById('weight').value.trim(),touch:document.getElementById('touch').value.trim(),advance:document.getElementById('advance').value||0,status:document.getElementById('status').value,date:document.getElementById('date').value});
save();closeModal();render();toast('Order saved ✓')
}
render();
</script>
</body>
</html>
