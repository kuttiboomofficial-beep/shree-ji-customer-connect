<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111">
<title>SHREE JI CONNECT</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f4f4;color:#171717}.top{position:sticky;top:0;z-index:20;background:#111;color:#fff;padding:12px 15px;display:flex;gap:12px;align-items:center}.logo{width:45px;height:45px;border-radius:50%;background:#d4ad58;color:#111;display:grid;place-items:center;font-weight:800}.top h1{font-size:18px;margin:0}.top small{color:#ccc}.wrap{max-width:1100px;margin:auto;padding:14px 12px 45px}.nav{display:flex;gap:7px;overflow:auto;padding:4px 0 12px;position:sticky;top:69px;z-index:10;background:#f4f4f4}.nav button{white-space:nowrap;border:1px solid #ddd;background:#fff;border-radius:11px;padding:10px 12px;font-weight:700}.nav button.active{background:#d4ad58;color:#fff}.card{background:#fff;border-radius:18px;padding:17px;margin:11px 0;box-shadow:0 2px 12px #0000000d}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}.stat{background:#fff;border-radius:16px;padding:16px}.stat b{font-size:25px;display:block;margin-bottom:4px}.muted{color:#777}.field{margin:10px 0}.field label{display:block;font-weight:700;margin-bottom:5px}.field input,.field select,.field textarea,.search{width:100%;padding:12px;border:1px solid #ddd;border-radius:11px;font-size:16px;background:#fff}.field textarea{min-height:100px;resize:vertical}.actions{display:flex;gap:7px;flex-wrap:wrap}.btn{border:0;border-radius:11px;padding:10px 14px;background:#eee;font-weight:700;font-size:14px}.gold{background:#d0aa55;color:#fff}.green{background:#168b58;color:#fff}.red{background:#d84b4b;color:#fff}.dark{background:#222;color:#fff}.small{padding:7px 9px;font-size:12px}.customer,.order,.template,.review{border:1px solid #eee;border-radius:14px;padding:13px;margin:8px 0}.customer h3{margin:0 0 7px}.history{border-top:1px solid #eee;margin-top:11px;padding-top:11px}.pill{display:inline-block;padding:4px 8px;border-radius:20px;background:#eee;font-size:11px;font-weight:700}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:50;align-items:flex-end}.modal.show{display:flex}.box{background:#fff;width:100%;max-width:740px;margin:auto;border-radius:21px 21px 0 0;padding:19px;max-height:94vh;overflow:auto}.close{float:right;border:0;background:#eee;border-radius:50%;width:34px;height:34px;font-size:20px}.empty{text-align:center;color:#888;padding:24px}.toast{display:none;position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:11px 16px;border-radius:10px;z-index:100;max-width:90%;text-align:center}.preview{background:#f8f8f8;border-radius:12px;padding:12px;white-space:pre-wrap}.checkrow{display:flex;gap:9px;align-items:center;padding:9px 0;border-bottom:1px solid #eee}.checkrow input{width:19px;height:19px}.footer{text-align:center;color:#888;font-size:12px;padding:18px}@media(max-width:720px){.stats,.grid3,.grid2{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header class="top"><div class="logo">SJ</div><div><h1>SHREE JI CONNECT</h1><small>SHREE JI GOLD CREATOR LLP</small></div></header>
<div class="wrap">
<nav class="nav" id="nav">
<button data-page="dashboard" onclick="page('dashboard')">🏠 Dashboard</button>
<button data-page="customers" onclick="page('customers')">👥 Customers</button>
<button data-page="orders" onclick="page('orders')">📦 Orders</button>
<button data-page="whatsapp" onclick="page('whatsapp')">💬 WhatsApp</button>
<button data-page="reviews" onclick="page('reviews')">⭐ Reviews</button>
<button data-page="backup" onclick="page('backup')">💾 Backup</button>
</nav>
<main id="app"></main>
<div class="footer">SHREE JI CONNECT • Customer CRM • Order Management • WhatsApp Center</div>
</div>
<div id="modal" class="modal"><div class="box"><button class="close" onclick="closeModal()">×</button><div id="form"></div></div></div>
<div id="toast" class="toast"></div>

<script>
const KEY='shree_ji_connect_final_v2';
let DB=loadDB();

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function defaults(){return[
{id:uid(),name:'Exhibition Invite',message:'Dear {{name}},\\n\\nWe warmly invite you to visit our exhibition.\\n\\nRegards,\\nSHREE JI GOLD CREATOR LLP'},
{id:uid(),name:'Festival Greeting',message:'Dear {{name}},\\n\\nWarm festival wishes from SHREE JI GOLD CREATOR LLP.\\nThank you for your continued support.'},
{id:uid(),name:'Stall Visit Thank You',message:'Dear {{name}},\\n\\nThank you for visiting our stall. We truly appreciate your valuable time and support.\\n\\nRegards,\\nSHREE JI GOLD CREATOR LLP'},
{id:uid(),name:'Order Thank You',message:'Dear {{name}},\\n\\nThank you for your valuable order {{orderNo}}.\\n\\nRegards,\\nSHREE JI GOLD CREATOR LLP'},
{id:uid(),name:'Order Started',message:'Dear {{name}},\\n\\nYour order {{orderNo}} has been started.\\nStatus: {{status}}\\n\\nThank you.'},
{id:uid(),name:'Order Completed',message:'Dear {{name}},\\n\\nYour order {{orderNo}} has been completed.\\n\\nThank you,\\nSHREE JI GOLD CREATOR LLP'},
{id:uid(),name:'Ready for Delivery',message:'Dear {{name}},\\n\\nYour order {{orderNo}} is ready for delivery.\\nDelivery date: {{deliveryDate}}\\n\\nThank you.'},
{id:uid(),name:'Delivery Update',message:'Dear {{name}},\\n\\nUpdate for order {{orderNo}}:\\nDelivery date: {{deliveryDate}}\\nStatus: {{status}}'},
{id:uid(),name:'Review Request',message:'Dear {{name}},\\n\\nThank you for choosing SHREE JI GOLD CREATOR LLP. We would appreciate your valuable review.'},
{id:uid(),name:'Repeat Order',message:'Dear {{name}},\\n\\nWe would be happy to assist you with your next order. Please feel free to contact us.'},
{id:uid(),name:'New Collection',message:'Dear {{name}},\\n\\nOur new collection is now available. Please contact us for the latest designs.'},
{id:uid(),name:'Follow-up',message:'Dear {{name}},\\n\\nJust following up regarding your order / requirement. Please let us know if you need any assistance.'}
]}
function loadDB(){try{let d=JSON.parse(localStorage.getItem(KEY)||'null');if(d&&Array.isArray(d.customers)&&Array.isArray(d.templates))return d}catch(e){}return{customers:[],templates:defaults(),reviews:[]}}
function saveDB(){localStorage.setItem(KEY,JSON.stringify(DB))}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function money(x){return Number(x||0).toLocaleString('en-IN')}
function toast(t){let x=document.getElementById('toast');x.textContent=t;x.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>x.style.display='none',1800)}
function orders(){return DB.customers.flatMap(c=>(c.orders||[]).map(o=>({...o,customerId:c.id,customerName:c.name,mobile:c.mobile,shop:c.shop,city:c.city})));}
function latestOrder(c){return (c.orders||[]).slice().sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''))[0]}
function page(p){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));({dashboard,customers:customersPage,orders:ordersPage,whatsapp:whatsappPage,reviews:reviewsPage,backup:backupPage}[p]||dashboard)()}

function dashboard(){
let os=orders(),active=os.filter(o=>!['Completed','Delivered'].includes(o.status)).length,done=os.filter(o=>['Completed','Delivered'].includes(o.status)).length,pending=os.filter(o=>o.deliveryDate&&new Date(o.deliveryDate)>=new Date()&&!['Delivered','Completed'].includes(o.status)).length;
document.getElementById('app').innerHTML=`<section class="card"><h2>Owner Dashboard</h2><p class="muted">SHREE JI CONNECT overview</p><div class="actions"><button class="btn gold" onclick="openCustomer()">＋ Add Customer</button><button class="btn" onclick="page('orders')">📦 Order Management</button><button class="btn green" onclick="page('whatsapp')">💬 WhatsApp Center</button></div></section>
<div class="stats"><div class="stat"><b>${DB.customers.length}</b>Total customers</div><div class="stat"><b>${active}</b>Active orders</div><div class="stat"><b>${done}</b>Completed orders</div><div class="stat"><b>${pending}</b>Pending delivery</div></div>
<section class="card"><h3>Order value</h3><h2>₹${money(os.reduce((s,o)=>s+Number(o.value||0),0))}</h2></section>
<section class="card"><h3>Recent orders</h3>${os.sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||'')).slice(0,5).map(orderCard).join('')||'<div class="empty">No recent orders</div>'}</section>
<section class="card"><h3>Recent reviews</h3>${(DB.reviews||[]).slice().reverse().slice(0,5).map(r=>`<div class="review"><b>⭐ ${esc(r.customer)}</b><br>${esc(r.text||'No comment')}</div>`).join('')||'<div class="empty">No reviews yet</div>'}</section>`}

function customersPage(){document.getElementById('app').innerHTML=`<section class="card"><div class="actions" style="justify-content:space-between"><h2>👥 Customer CRM</h2><button class="btn gold" onclick="openCustomer()">＋ Add Customer</button></div><input id="custSearch" class="search" placeholder="Search name, WhatsApp, shop or city..." oninput="renderCustomers()"><div id="customerList"></div></section>`;renderCustomers()}
function renderCustomers(){let q=(document.getElementById('custSearch')?.value||'').toLowerCase(),a=DB.customers.filter(c=>(c.name+' '+c.mobile+' '+c.shop+' '+c.city).toLowerCase().includes(q));document.getElementById('customerList').innerHTML=a.length?a.map(c=>`<div class="customer"><h3>${esc(c.name)}</h3><div>📱 ${esc(c.mobile)}</div><div>🏪 ${esc(c.shop||'-')}</div><div>📍 ${esc(c.city||'-')}</div><div>📝 ${esc(c.notes||'-')}</div><div class="actions" style="margin-top:9px"><button class="btn gold small" onclick="openOrder('${c.id}')">＋ Order</button><button class="btn small" onclick="editCustomer('${c.id}')">✏️ Edit</button><button class="btn green small" onclick="whatsappCustomer('${c.id}')">💬 WhatsApp</button><button class="btn small" onclick="history('${c.id}')">📋 History</button><button class="btn red small" onclick="deleteCustomer('${c.id}')">🗑 Delete</button></div><div class="history"><b>Customer history — ${(c.orders||[]).length} order(s)</b>${(c.orders||[]).slice().reverse().map(o=>orderCard({...o,customerId:c.id,customerName:c.name})).join('')||'<div class="empty">No previous orders</div>'}</div></div>`).join('')||'<div class="empty">No customers found.</div>'}
function openCustomer(id=null){let c=id?DB.customers.find(x=>x.id===id):null;document.getElementById('form').innerHTML=`<h2>${c?'Edit':'Add'} Customer</h2><div class="field"><label>Name *</label><input id="c_name" value="${esc(c?.name||'')}"></div><div class="field"><label>WhatsApp Number *</label><input id="c_mobile" inputmode="tel" value="${esc(c?.mobile||'')}"></div><div class="field"><label>Shop / Company</label><input id="c_shop" value="${esc(c?.shop||'')}"></div><div class="field"><label>City</label><input id="c_city" value="${esc(c?.city||'')}"></div><div class="field"><label>Notes</label><textarea id="c_notes">${esc(c?.notes||'')}</textarea></div><button class="btn gold" onclick="saveCustomer('${id||''}')">Save Customer</button>`;showModal()}
function saveCustomer(id){let name=document.getElementById('c_name').value.trim(),mobile=document.getElementById('c_mobile').value.trim();if(!name||!mobile)return toast('Name and WhatsApp number required');if(id){let c=DB.customers.find(x=>x.id===id);Object.assign(c,{name,mobile,shop:c_shop.value.trim(),city:c_city.value.trim(),notes:c_notes.value.trim()})}else DB.customers.push({id:uid(),name,mobile,shop:c_shop.value.trim(),city:c_city.value.trim(),notes:c_notes.value.trim(),createdAt:new Date().toISOString(),orders:[]});saveDB();closeModal();page('customers');toast('Customer saved ✓')}
function editCustomer(id){openCustomer(id)}
function deleteCustomer(id){if(confirm('Delete customer and all orders?')){DB.customers=DB.customers.filter(c=>c.id!==id);saveDB();renderCustomers();toast('Customer deleted')}}
function history(id){let c=DB.customers.find(x=>x.id===id);if(!c)return;document.getElementById('form').innerHTML=`<h2>📋 ${esc(c.name)} — Customer History</h2><p>📱 ${esc(c.mobile)}<br>🏪 ${esc(c.shop||'-')} • 📍 ${esc(c.city||'-')}</p>${(c.orders||[]).slice().reverse().map(o=>orderCard({...o,customerId:c.id,customerName:c.name})).join('')||'<div class="empty">No previous orders</div>'}`;showModal()}

function openOrder(cid,oid=''){let c=DB.customers.find(x=>x.id===cid);if(!c)return;let o=oid?(c.orders||[]).find(x=>x.id===oid):null;document.getElementById('form').innerHTML=`<h2>${o?'Edit':'New'} Order</h2><p><b>${esc(c.name)}</b> • ${esc(c.mobile)}</p>
<div class="field"><label>Order number *</label><input id="o_no" value="${esc(o?.orderNo||'')}"></div>
<div class="field"><label>Item</label><input id="o_item" value="${esc(o?.item||'')}"></div>
<div class="grid2"><div class="field"><label>Start date</label><input id="o_start" type="date" value="${esc(o?.startDate||today())}"></div><div class="field"><label>Expected finish</label><input id="o_expected" type="date" value="${esc(o?.expectedFinish||'')}"></div></div>
<div class="grid2"><div class="field"><label>Actual finish</label><input id="o_actual" type="date" value="${esc(o?.actualFinish||'')}"></div><div class="field"><label>Delivery date</label><input id="o_delivery" type="date" value="${esc(o?.deliveryDate||'')}"></div></div>
<div class="grid2"><div class="field"><label>Status</label><select id="o_status">${['Pending','Started','Processing','Completed','Ready for Delivery','Delivered'].map(s=>`<option ${o?.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>Value</label><input id="o_value" type="number" min="0" value="${esc(o?.value||'')}"></div></div>
<div class="grid2"><div class="field"><label>Advance</label><input id="o_advance" type="number" min="0" value="${esc(o?.advance||'')}"></div><div class="field"><label>Gold weight</label><input id="o_weight" value="${esc(o?.goldWeight||'')}"></div></div>
<div class="grid2"><div class="field"><label>Gold touch</label><input id="o_touch" value="${esc(o?.goldTouch||'')}"></div><div class="field"><label>Screw type</label><input id="o_screw" value="${esc(o?.screwType||'')}"></div></div>
<div class="field"><label>Notes</label><textarea id="o_notes">${esc(o?.notes||'')}</textarea></div>
<button class="btn gold" onclick="saveOrder('${cid}','${oid}')">${o?'Update':'Save'} Order</button>`;showModal()}
function today(){return new Date().toISOString().slice(0,10)}
function saveOrder(cid,oid){let c=DB.customers.find(x=>x.id===cid);if(!c)return;let no=document.getElementById('o_no').value.trim();if(!no)return toast('Order number required');let d={id:oid||uid(),orderNo:no,item:o_item.value.trim(),startDate:o_start.value,expectedFinish:o_expected.value,actualFinish:o_actual.value,deliveryDate:o_delivery.value,status:o_status.value,value:Number(o_value.value||0),advance:Number(o_advance.value||0),goldWeight:o_weight.value.trim(),goldTouch:o_touch.value.trim(),screwType:o_screw.value.trim(),notes:o_notes.value.trim(),createdAt:oid?((c.orders.find(x=>x.id===oid)||{}).createdAt||new Date().toISOString()):new Date().toISOString()};c.orders=c.orders||[];if(oid){let i=c.orders.findIndex(x=>x.id===oid);if(i>=0)c.orders[i]=d}else c.orders.push(d);saveDB();closeModal();page('orders');toast('Order saved ✓')}
function orderCard(o){return `<div class="order"><div class="actions" style="justify-content:space-between"><b>📦 ${esc(o.orderNo)}</b><span class="pill">${esc(o.status||'Pending')}</span></div><div>👤 ${esc(o.customerName||'-')}</div><div>💎 ${esc(o.item||'-')}</div><div>💰 Value ₹${money(o.value)} • Advance ₹${money(o.advance)}</div><div>⚖️ ${esc(o.goldWeight||'-')} • Touch ${esc(o.goldTouch||'-')} • Screw ${esc(o.screwType||'-')}</div><div>📅 Start ${esc(o.startDate||'-')} • Delivery ${esc(o.deliveryDate||'-')}</div><div class="actions" style="margin-top:7px"><button class="btn small" onclick="openOrder('${o.customerId}','${o.id}')">✏️ Edit</button><button class="btn green small" onclick="whatsappOrder('${o.customerId}','${o.id}')">💬 WhatsApp</button></div></div>`}
function ordersPage(){document.getElementById('app').innerHTML=`<section class="card"><div class="actions" style="justify-content:space-between"><h2>📦 Order Management</h2><button class="btn gold" onclick="page('customers')">＋ Select Customer</button></div><input id="orderSearch" class="search" placeholder="Search order, customer, item, status..." oninput="renderOrders()"><div id="ordersList"></div></section>`;renderOrders()}
function renderOrders(){let q=(document.getElementById('orderSearch')?.value||'').toLowerCase(),a=orders().filter(o=>(o.orderNo+' '+o.customerName+' '+o.item+' '+o.status).toLowerCase().includes(q));document.getElementById('ordersList').innerHTML=a.sort((x,y)=>(y.createdAt||'').localeCompare(x.createdAt||'')).map(orderCard).join('')||'<div class="empty">No orders found.</div>'}
function whatsappOrder(cid,oid){sessionStorage.setItem('waCustomerId',cid);sessionStorage.setItem('waOrderId',oid);page('whatsapp')}

function whatsappCustomer(id){sessionStorage.setItem('waCustomerId',id);page('whatsapp')}
function normalizePhone(p){let n=String(p||'').replace(/\D/g,'');if(n.length===10)n='91'+n;return n}
function getTemplate(id){return DB.templates.find(t=>t.id===id)||DB.templates[0]}
function applyTemplate(msg,c,o){return String(msg||'').replaceAll('{{name}}',c?.name||'').replaceAll('{{phone}}',c?.mobile||'').replaceAll('{{company}}','SHREE JI GOLD CREATOR LLP').replaceAll('{{shop}}',c?.shop||'').replaceAll('{{city}}',c?.city||'').replaceAll('{{orderNo}}',o?.orderNo||'').replaceAll('{{item}}',o?.item||'').replaceAll('{{startDate}}',o?.startDate||'').replaceAll('{{expectedFinish}}',o?.expectedFinish||'').replaceAll('{{actualFinish}}',o?.actualFinish||'').replaceAll('{{deliveryDate}}',o?.deliveryDate||'').replaceAll('{{status}}',o?.status||'').replaceAll('{{value}}',money(o?.value||0)).replaceAll('{{advance}}',money(o?.advance||0)).replaceAll('{{goldWeight}}',o?.goldWeight||'').replaceAll('{{goldTouch}}',o?.goldTouch||'').replaceAll('{{screwType}}',o?.screwType||'')}
function whatsappPage(){let cid=sessionStorage.getItem('waCustomerId')||'',oid=sessionStorage.getItem('waOrderId')||'';sessionStorage.removeItem('waCustomerId');sessionStorage.removeItem('waOrderId');document.getElementById('app').innerHTML=`<section class="card"><h2>💬 WhatsApp Center</h2><div class="field"><label>Select Customer</label><select id="wa_customer" onchange="loadWA()"><option value="">— Select customer —</option>${DB.customers.map(c=>`<option value="${esc(c.id)}" ${c.id===cid?'selected':''}>${esc(c.name)} — ${esc(c.mobile)}</option>`).join('')}</select></div><div class="field"><label>Previous / Latest Order</label><select id="wa_order" onchange="loadWA()"><option value="">Latest order</option></select></div><div class="field"><label>WhatsApp Number</label><input id="wa_phone" readonly></div><div class="field"><label>Message</label><textarea id="wa_message"></textarea></div><button class="btn green" onclick="openWA()">💬 Open WhatsApp</button></section><section class="card"><h3>Message Templates</h3><select id="wa_template" onchange="loadWA()">${DB.templates.map(t=>`<option value="${esc(t.id)}">${esc(t.name)}</option>`).join('')}</select><p class="muted">Templates: Exhibition Invite • Festival Greeting • Stall Visit Thank You • Order Thank You • Order Started • Order Completed • Ready for Delivery • Delivery Update • Review Request • Repeat Order • New Collection • Follow-up</p></section><section class="card"><h3>Bulk WhatsApp</h3><div class="actions"><button class="btn" onclick="bulkSelect(true)">Select All</button><button class="btn" onclick="bulkSelect(false)">Clear</button></div><div id="bulkList"></div><button class="btn green" onclick="bulkWA()">💬 Start WhatsApp</button></section>`;renderBulk();if(cid){document.getElementById('wa_customer').value=cid;fillOrderSelect(cid,oid);loadWA()}}
function fillOrderSelect(cid,oid=''){let c=DB.customers.find(x=>x.id===cid),s=document.getElementById('wa_order');if(!s)return;s.innerHTML='<option value="">Latest order</option>'+(c?.orders||[]).slice().reverse().map(o=>`<option value="${esc(o.id)}" ${o.id===oid?'selected':''}>${esc(o.orderNo)} — ${esc(o.item||'')}</option>`).join('')}
function loadWA(){let cid=document.getElementById('wa_customer')?.value,c=DB.customers.find(x=>x.id===cid);if(!c)return;fillOrderSelect(cid,document.getElementById('wa_order')?.value||'');let oid=document.getElementById('wa_order')?.value,o=oid?(c.orders||[]).find(x=>x.id===oid):latestOrder(c);document.getElementById('wa_phone').value=c.mobile||'';let t=getTemplate(document.getElementById('wa_template')?.value);document.getElementById('wa_message').value=applyTemplate(t?.message,c,o)}
function openWA(){let n=normalizePhone(document.getElementById('wa_phone').value),m=document.getElementById('wa_message').value.trim();if(!n)return toast('Select customer first');if(!m)return toast('Enter message');window.open('https://wa.me/'+n+'?text='+encodeURIComponent(m),'_blank')}
function renderBulk(){let b=document.getElementById('bulkList');if(!b)return;b.innerHTML=DB.customers.map(c=>`<label class="checkrow"><input class="bulkCheck" type="checkbox" value="${esc(c.id)}"><span>👤 <b>${esc(c.name)}</b> — ${esc(c.mobile)}</span></label>`).join('')||'<div class="empty">No customers</div>'}
function bulkSelect(v){document.querySelectorAll('.bulkCheck').forEach(x=>x.checked=v)}
function bulkWA(){let t=getTemplate(document.getElementById('wa_template')?.value),ids=[...document.querySelectorAll('.bulkCheck:checked')].map(x=>x.value);if(!ids.length)return toast('Select customers');ids.forEach((id,i)=>{let c=DB.customers.find(x=>x.id===id),u='https://wa.me/'+normalizePhone(c.mobile)+'?text='+encodeURIComponent(applyTemplate(t.message,c,latestOrder(c)));setTimeout(()=>window.open(u,'_blank'),i*800)})}

function reviewsPage(){document.getElementById('app').innerHTML=`<section class="card"><h2>⭐ Reviews</h2><button class="btn gold" onclick="addReview()">＋ Add Review</button><div>${(DB.reviews||[]).slice().reverse().map(r=>`<div class="review"><b>${esc(r.customer)} — ${'⭐'.repeat(Math.max(1,Math.min(5,Number(r.rating||5))))}</b><p>${esc(r.text||'')}</p></div>`).join('')||'<div class="empty">No reviews yet</div>'}</div></section>`}
function addReview(){document.getElementById('form').innerHTML=`<h2>Add Review</h2><div class="field"><label>Customer</label><input id="r_customer"></div><div class="field"><label>Rating</label><select id="r_rating"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select></div><div class="field"><label>Review</label><textarea id="r_text"></textarea></div><button class="btn gold" onclick="saveReview()">Save Review</button>`;showModal()}
function saveReview(){DB.reviews=DB.reviews||[];DB.reviews.push({id:uid(),customer:r_customer.value.trim(),rating:r_rating.value,text:r_text.value.trim(),date:today()});saveDB();closeModal();page('reviews');toast('Review saved ✓')}

function backupPage(){document.getElementById('app').innerHTML=`<section class="card"><h2>💾 Backup & Restore</h2><p>Export customers, complete order history, templates and reviews.</p><div class="actions"><button class="btn green" onclick="exportBackup()">⬇️ Export Backup</button><label class="btn">⬆️ Import Backup<input hidden type="file" accept="application/json" onchange="importBackup(event)"></label></div></section>`}
function exportBackup(){let blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='shree-ji-connect-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Backup downloaded ✓')}
function importBackup(e){let f=e.target.files?.[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.customers)||!Array.isArray(d.templates))throw Error();DB=d;saveDB();page('dashboard');toast('Backup restored ✓')}catch(x){toast('Invalid backup')}};r.readAsText(f)}
function showModal(){document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}
page('dashboard');
</script>
</body></html>
