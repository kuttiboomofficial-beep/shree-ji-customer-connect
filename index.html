<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111">
<meta name="description" content="SHREE JI CONNECT - Customer CRM, Orders and WhatsApp">
<link rel="manifest" href="manifest.json">
<title>SHREE JI CONNECT</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f5f5;
  color:#171717;
  font-size:16px;
}

.top{
  height:76px;
  background:#111;
  color:#fff;
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px 16px;
  position:sticky;
  top:0;
  z-index:30;
}

.menuBtn{
  width:46px;
  height:46px;
  border:0;
  background:transparent;
  color:#fff;
  font-size:29px;
  cursor:pointer;
}

.logo{
  width:48px;
  height:48px;
  border-radius:50%;
  background:#d4ad58;
  color:#111;
  display:grid;
  place-items:center;
  font-weight:800;
}

.top h1{
  font-size:18px;
  margin:0;
}

.top small{
  color:#ccc;
}

.wrap{
  max-width:1100px;
  margin:auto;
  padding:18px 14px 55px;
}

.drawer{
  position:fixed;
  inset:0;
  z-index:100;
  pointer-events:none;
}

.drawer:before{
  content:"";
  position:absolute;
  inset:0;
  background:#0008;
  opacity:0;
  transition:.2s;
}

.drawer.open{
  pointer-events:auto;
}

.drawer.open:before{
  opacity:1;
}

.side{
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:min(320px,86vw);
  background:#fff;
  transform:translateX(-100%);
  transition:.25s;
  box-shadow:5px 0 25px #0003;
  overflow:auto;
}

.drawer.open .side{
  transform:translateX(0);
}

.sideHead{
  background:#111;
  color:#fff;
  padding:18px;
  display:flex;
  align-items:center;
  gap:12px;
}

.sideHead .logo{
  width:44px;
  height:44px;
}

.sideHead b{
  font-size:16px;
}

.sideHead small{
  display:block;
  color:#ccc;
  margin-top:3px;
}

.sideClose{
  margin-left:auto;
  background:#333;
  color:#fff;
  border:0;
  border-radius:50%;
  width:36px;
  height:36px;
  font-size:22px;
}

.sideNav{
  padding:12px;
}

.sideNav button{
  width:100%;
  border:0;
  background:#fff;
  text-align:left;
  padding:14px;
  border-radius:12px;
  font-size:16px;
  font-weight:700;
  margin:3px 0;
}

.sideNav button.active{
  background:#f2dfad;
}

.card{
  background:#fff;
  border-radius:20px;
  padding:18px;
  margin:13px 0;
  box-shadow:0 2px 14px #0000000d;
}

.hero{
  padding:24px;
}

.hero h2{
  font-size:28px;
  margin:0 0 8px;
}

.muted{
  color:#777;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

.stat{
  background:#fff;
  border-radius:18px;
  padding:18px;
  box-shadow:0 2px 12px #0000000d;
}

.stat b{
  font-size:27px;
  display:block;
  margin-bottom:6px;
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.grid3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.field{
  margin:11px 0;
}

.field label{
  display:block;
  font-weight:700;
  margin-bottom:6px;
}

.field input,
.field select,
.field textarea{
  width:100%;
  padding:14px;
  border:1px solid #d5d5d5;
  border-radius:11px;
  font-size:17px;
  background:#fff;
  color:#111;
}

.field input:focus,
.field select:focus,
.field textarea:focus{
  outline:2px solid #d4ad58;
  border-color:#d4ad58;
}

.field textarea{
  min-height:110px;
  resize:vertical;
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.btn{
  border:0;
  border-radius:11px;
  padding:12px 15px;
  background:#eee;
  font-weight:700;
  font-size:15px;
  cursor:pointer;
}

.gold{
  background:#d0aa55;
  color:#fff;
}

.green{
  background:#168b58;
  color:#fff;
}

.red{
  background:#d84b4b;
  color:#fff;
}

.dark{
  background:#222;
  color:#fff;
}

.small{
  padding:8px 10px;
  font-size:13px;
}

.search{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:11px;
  font-size:16px;
}

.customer,
.order,
.template{
  border:1px solid #eee;
  border-radius:15px;
  padding:15px;
  margin:10px 0;
}

.customer h3{
  margin:0 0 7px;
}

.pill{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  background:#eee;
  font-size:12px;
  font-weight:700;
}

.history{
  border-top:1px solid #eee;
  margin-top:13px;
  padding-top:13px;
}

.preview{
  background:#f8f8f8;
  border-radius:12px;
  padding:13px;
  white-space:pre-wrap;
}

.empty{
  text-align:center;
  color:#888;
  padding:28px;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#0008;
  z-index:150;
  align-items:flex-end;
}

.modal.show{
  display:flex;
}

.box{
  background:#fff;
  width:100%;
  max-width:760px;
  margin:auto;
  border-radius:22px 22px 0 0;
  padding:20px;
  max-height:94vh;
  overflow:auto;
}

.close{
  float:right;
  border:0;
  background:#eee;
  border-radius:50%;
  width:35px;
  height:35px;
  font-size:20px;
}

.toast{
  display:none;
  position:fixed;
  bottom:22px;
  left:50%;
  transform:translateX(-50%);
  background:#222;
  color:#fff;
  padding:12px 17px;
  border-radius:10px;
  z-index:200;
  max-width:90%;
  text-align:center;
}

.footer{
  text-align:center;
  color:#888;
  font-size:12px;
  padding:20px;
}

.checkrow{
  display:flex;
  align-items:center;
  gap:9px;
  padding:10px 0;
  border-bottom:1px solid #eee;
}

.checkrow input{
  width:20px;
  height:20px;
}

.kpiTitle{
  font-size:14px;
  color:#777;
}

.quick{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

/* RING SIZE */
.ringBox{
  border:1px solid #ddd;
  border-radius:14px;
  padding:14px;
  background:#fafafa;
}

.ringTitle{
  font-weight:700;
  margin-bottom:10px;
}

.ringHint{
  font-size:13px;
  color:#777;
  margin-top:5px;
}

.ringInput{
  font-size:20px !important;
  font-weight:700;
  text-align:center;
}

@media(max-width:720px){

  .stats{
    grid-template-columns:1fr 1fr;
  }

  .grid2,
  .grid3{
    grid-template-columns:1fr;
  }

  .quick{
    grid-template-columns:1fr;
  }

  .hero h2{
    font-size:24px;
  }

  .field input,
  .field select,
  .field textarea{
    font-size:16px;
  }
}
</style>
</head>

<body>

<header class="top">
<button class="menuBtn" onclick="openDrawer()" aria-label="Menu">☰</button>
<div class="logo">SJ</div>
<div>
<h1>SHREE JI CONNECT</h1>
<small>SHREE JI GOLD CREATOR LLP</small>
</div>
</header>

<div id="drawer" class="drawer" onclick="if(event.target===this)closeDrawer()">

<aside class="side">

<div class="sideHead">
<div class="logo">SJ</div>
<div>
<b>SHREE JI CONNECT</b>
<small>SHREE JI GOLD CREATOR LLP</small>
</div>
<button class="sideClose" onclick="closeDrawer()">×</button>
</div>

<nav class="sideNav" id="sideNav">

<button data-page="dashboard" onclick="go('dashboard')">
🏠 Dashboard
</button>

<button data-page="customers" onclick="go('customers')">
👥 Customer CRM
</button>

<button data-page="orders" onclick="go('orders')">
📦 Order Management
</button>

<button data-page="whatsapp" onclick="go('whatsapp')">
💬 WhatsApp Center
</button>

<button data-page="templates" onclick="go('templates')">
📝 Message Templates
</button>

<button data-page="backup" onclick="go('backup')">
💾 Backup & Restore
</button>

</nav>
</aside>
</div>

<div class="wrap">
<main id="app"></main>

<div class="footer">
SHREE JI CONNECT • Data stays in this browser unless you export a backup.
</div>
</div>

<div id="modal" class="modal">
<div class="box">
<button class="close" onclick="closeModal()">×</button>
<div id="form"></div>
</div>
</div>

<div id="toast" class="toast"></div>

<script>

const KEY='shree_ji_connect_final_v2';

let DB=loadDB();

function uid(){
return Date.now().toString(36)+Math.random().toString(36).slice(2,8);
}

function loadDB(){
try{
const d=JSON.parse(localStorage.getItem(KEY)||'null');

if(
d &&
Array.isArray(d.customers) &&
Array.isArray(d.templates)
){
return d;
}

}catch(e){}

return{
customers:[],
templates:defaultTemplates()
};
}

function saveDB(){
localStorage.setItem(KEY,JSON.stringify(DB));
}

function defaultTemplates(){

const x=[

['Exhibition Invite',
'Dear {{name}},\n\nYou are warmly invited to visit SHREE JI GOLD CREATOR LLP at our exhibition.\n\nWe look forward to seeing you.'
],

['Festival Greeting',
'Dear {{name}},\n\nWarm festival wishes from SHREE JI GOLD CREATOR LLP.\n\nThank you for your continued support.'
],

['Stall Visit Thank You',
'Dear {{name}},\n\nThank you for visiting our stall. It was a pleasure meeting you.\n\nRegards,\nSHREE JI GOLD CREATOR LLP'
],

['Order Thank You',
'Dear {{name}},\n\nThank you for your valuable order {{orderNo}}. We truly appreciate your trust and support.'
],

['Order Started',
'Dear {{name}},\n\nYour order {{orderNo}} has been started.\nStatus: {{status}}\n\nThank you.'
],

['Order Completed',
'Dear {{name}},\n\nYour order {{orderNo}} has been completed successfully.\n\nThank you for choosing SHREE JI GOLD CREATOR LLP.'
],

['Ready for Delivery',
'Dear {{name}},\n\nYour order {{orderNo}} is ready for delivery.\nWeight: {{weight}}\n\nPlease contact us for delivery.'
],

['Delivery Update',
'Dear {{name}},\n\nUpdate for order {{orderNo}}: {{status}}.\n\nThank you.'
],

['Review Request',
'Dear {{name}},\n\nThank you for your order. We would appreciate your valuable feedback and review.'
],

['Repeat Order',
'Dear {{name}},\n\nIt has been a while since your last order. We would be happy to serve you again.'
],

['New Collection',
'Dear {{name}},\n\nOur new jewellery collection is now available. Please contact us for the latest designs.'
],

['Follow-up',
'Dear {{name}},\n\nJust following up regarding your order / enquiry. Please let us know if you need any assistance.'
]

];

return x.map(([name,message])=>({
id:uid(),
name,
message
}));

}

function esc(x){
return String(x??'').replace(/[&<>"']/g,m=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#39;'
}[m]));
}

function money(x){
return Number(x||0).toLocaleString('en-IN');
}

function toast(t){
const x=document.getElementById('toast');

x.textContent=t;
x.style.display='block';

clearTimeout(window.tt);

window.tt=setTimeout(()=>{
x.style.display='none';
},1900);
}

function openDrawer(){
document.getElementById('drawer').classList.add('open');
}

function closeDrawer(){
document.getElementById('drawer').classList.remove('open');
}

function go(p){

closeDrawer();

document.querySelectorAll('#sideNav button')
.forEach(b=>{
b.classList.toggle(
'active',
b.dataset.page===p
);
});

({
dashboard,
customers:customersPage,
orders:ordersPage,
whatsapp:whatsappPage,
templates:templatesPage,
backup:backupPage
}[p]||dashboard)();

}

function allOrders(){

return DB.customers
.flatMap(c=>
(c.orders||[]).map(o=>({
...o,
customerId:c.id,
customerName:c.name,
mobile:c.mobile,
shop:c.shop,
city:c.city
}))
)
.sort((a,b)=>
(b.createdAt||'').localeCompare(a.createdAt||'')
);

}

function statusActive(s){
return !['Completed','Delivered'].includes(s||'');
}

/* DASHBOARD */

function dashboard(){

const os=allOrders();

const active=os.filter(o=>statusActive(o.status)).length;

const done=os.filter(o=>
['Completed','Delivered'].includes(o.status)
).length;

const pending=os.filter(o=>
!['Completed','Delivered'].includes(o.status)
).length;

const value=os.reduce(
(s,o)=>s+Number(o.value||0),
0
);

document.getElementById('app').innerHTML=`

<section class="card hero">

<h2>Welcome to SHREE JI CONNECT 👋</h2>

<p class="muted">
Customer Relationship & Order Management
</p>

<div class="actions">

<button class="btn gold"
onclick="openCustomer()">
＋ Add Customer
</button>

<button class="btn"
onclick="go('orders')">
📦 New Order
</button>

</div>

</section>

<div class="stats">

<div class="stat">
<b>${DB.customers.length}</b>
<span class="kpiTitle">Total Customers</span>
</div>

<div class="stat">
<b>${active}</b>
<span class="kpiTitle">Active Orders</span>
</div>

<div class="stat">
<b>${pending}</b>
<span class="kpiTitle">Pending Delivery</span>
</div>

<div class="stat">
<b>₹${money(value)}</b>
<span class="kpiTitle">Order Value</span>
</div>

</div>

<section class="card">

<div class="actions"
style="justify-content:space-between">

<h2 style="margin:0">
📦 Recent Orders
</h2>

<button class="btn small"
onclick="go('orders')">
View All
</button>

</div>

${
os.length
?
os.slice(0,5).map(orderCard).join('')
:
'<div class="empty">📦<br>No orders yet.<br>Your recent orders will appear here.</div>'
}

</section>

<section class="card">

<h2>⚡ Quick Actions</h2>

<div class="quick">

<button class="btn gold"
onclick="openCustomer()">
👤 Add Customer
</button>

<button class="btn"
onclick="go('orders')">
📦 New Order
</button>

<button class="btn green"
onclick="go('whatsapp')">
💬 WhatsApp Center
</button>

</div>

</section>

<section class="card">

<h3>📊 Overview</h3>

<div class="grid3">

<div>
<b>${done}</b>
<br>
<span class="muted">Completed Orders</span>
</div>

<div>
<b>
₹${money(
os.reduce(
(s,o)=>s+Number(o.advance||0),
0
)
)}
</b>
<br>
<span class="muted">Total Advance</span>
</div>

<div>
<b>${DB.templates.length}</b>
<br>
<span class="muted">WhatsApp Templates</span>
</div>

</div>

</section>
`;

}

/* CUSTOMERS */

function customersPage(){

document.getElementById('app').innerHTML=`

<section class="card">

<div class="actions"
style="justify-content:space-between">

<h2 style="margin:0">
👥 Customer CRM
</h2>

<button class="btn gold"
onclick="openCustomer()">
＋ Add Customer
</button>

</div>

<div class="field">

<input
id="custSearch"
class="search"
placeholder="Search name, WhatsApp, shop or city..."
oninput="renderCustomers()">

</div>

<div id="customerList"></div>

</section>
`;

renderCustomers();

}

function renderCustomers(){

const q=
(document.getElementById('custSearch')?.value||'')
.toLowerCase();

const a=DB.customers.filter(c=>
(
c.name+' '+
c.mobile+' '+
c.shop+' '+
c.city+' '+
c.notes
)
.toLowerCase()
.includes(q)
);

document.getElementById('customerList').innerHTML=
a.length
?
a.map(customerCard).join('')
:
'<div class="empty">No customers found.</div>';

}

function customerCard(c){

return `

<div class="customer">

<h3>${esc(c.name)}</h3>

<div>📱 ${esc(c.mobile)}</div>

<div>🏪 ${esc(c.shop||'-')}</div>

<div>📍 ${esc(c.city||'-')}</div>

${
c.notes
?
`<div>📝 ${esc(c.notes)}</div>`
:
''
}

<div class="actions"
style="margin-top:11px">

<button class="btn gold small"
onclick="addOrder('${c.id}')">
＋ Add Order
</button>

<button class="btn small"
onclick="editCustomer('${c.id}')">
✏️ Edit
</button>

<button class="btn small green"
onclick="whatsappCustomer('${c.id}')">
💬 WhatsApp
</button>

<button class="btn small"
onclick="openCustomerHistory('${c.id}')">
📋 History
</button>

<button class="btn red small"
onclick="deleteCustomer('${c.id}')">
🗑 Delete
</button>

</div>

<div class="history">

<b>
📦 Customer History
(${(c.orders||[]).length})
</b>

${
(c.orders||[]).length
?
(c.orders||[])
.slice()
.reverse()
.map(o=>
orderCard({
...o,
customerName:c.name,
customerId:c.id
})
)
.join('')
:
'<div class="empty">No previous orders</div>'
}

</div>

</div>

`;

}

/* ADD CUSTOMER */

function openCustomer(){

document.getElementById('form').innerHTML=`

<h2>👤 Add Customer</h2>

<div class="field">
<label>Name *</label>
<input
id="c_name"
placeholder="Customer name">
</div>

<div class="field">
<label>WhatsApp Number *</label>
<input
id="c_mobile"
inputmode="tel"
placeholder="10 digit mobile number">
</div>

<div class="grid2">

<div class="field">
<label>Shop / Company</label>
<input id="c_shop">
</div>

<div class="field">
<label>City</label>
<input id="c_city">
</div>

</div>

<div class="field">
<label>Notes</label>
<textarea id="c_notes"></textarea>
</div>

<div class="actions">

<button class="btn"
onclick="closeModal()">
Cancel
</button>

<button class="btn gold"
onclick="saveCustomer()">
Save Customer
</button>

</div>
`;

showModal();

}

function saveCustomer(){

const name=
document.getElementById('c_name').value.trim();

const mobile=
document.getElementById('c_mobile').value.trim();

if(!name||!mobile){
return toast(
'Name and WhatsApp number are required'
);
}

DB.customers.push({

id:uid(),
name,
mobile,
shop:document.getElementById('c_shop').value.trim(),
city:document.getElementById('c_city').value.trim(),
notes:document.getElementById('c_notes').value.trim(),
createdAt:new Date().toISOString(),
orders:[]

});

saveDB();

closeModal();

go('customers');

toast('Customer added ✓');

}

/* EDIT CUSTOMER */

function editCustomer(id){

const c=DB.customers.find(x=>x.id===id);

if(!c)return;

document.getElementById('form').innerHTML=`

<h2>✏️ Edit Customer</h2>

<div class="field">
<label>Name *</label>
<input
id="c_name"
value="${esc(c.name)}">
</div>

<div class="field">
<label>WhatsApp Number *</label>
<input
id="c_mobile"
value="${esc(c.mobile)}">
</div>

<div class="grid2">

<div class="field">
<label>Shop / Company</label>
<input
id="c_shop"
value="${esc(c.shop||'')}">
</div>

<div class="field">
<label>City</label>
<input
id="c_city"
value="${esc(c.city||'')}">
</div>

</div>

<div class="field">
<label>Notes</label>
<textarea id="c_notes">${esc(c.notes||'')}</textarea>
</div>

<div class="actions">

<button class="btn"
onclick="closeModal()">
Cancel
</button>

<button class="btn gold"
onclick="updateCustomer('${id}')">
Save Changes
</button>

</div>
`;

showModal();

}

function updateCustomer(id){

const c=DB.customers.find(x=>x.id===id);

if(!c)return;

c.name=document.getElementById('c_name').value.trim();

c.mobile=document.getElementById('c_mobile').value.trim();

c.shop=document.getElementById('c_shop').value.trim();

c.city=document.getElementById('c_city').value.trim();

c.notes=document.getElementById('c_notes').value.trim();

if(!c.name||!c.mobile){
return toast(
'Name and WhatsApp number are required'
);
}

saveDB();

closeModal();

go('customers');

toast('Customer updated ✓');

}

function deleteCustomer(id){

if(!confirm(
'Delete this customer and all order history?'
))return;

DB.customers=
DB.customers.filter(c=>c.id!==id);

saveDB();

renderCustomers();

toast('Customer deleted');

}

/* ORDER */

function addOrder(cid){

const c=DB.customers.find(x=>x.id===cid);

if(c)orderForm(c);

}

function orderForm(c,oid=null){

const o=oid
?
(c.orders||[]).find(x=>x.id===oid)
:
null;

document.getElementById('form').innerHTML=`

<h2>
${o?'✏️ Edit Order':'📦 New Order'}
</h2>

<p>
<b>${esc(c.name)}</b>
•
${esc(c.mobile)}
</p>

<div class="grid2">

<div class="field">
<label>Order Number *</label>
<input
id="o_no"
value="${esc(o?.orderNo||'')}"
placeholder="Example: SJ001">
</div>

<div class="field">
<label>Item</label>
<input
id="o_item"
value="${esc(o?.item||'')}"
placeholder="Example: Ring">
</div>

</div>

<div class="grid2">

<div class="field">

/* SAVE ORDER */

function saveOrder(cid,oid){

const c=DB.customers.find(x=>x.id===cid);

if(!c)return;

const no=
document.getElementById('o_no').value.trim();

if(!no){
return toast(
'Order Number is required'
);
}

const ladySize=
document.getElementById('o_ladySize').value.trim();

const gentsSize=
document.getElementById('o_gentsSize').value.trim();

/* Ring validation */

if(ladySize){

const n=Number(ladySize);

if(n<9||n>15){
return toast(
"Lady's ring size must be 9 to 15"
);
}

}

if(gentsSize){

const n=Number(gentsSize);

if(n<17||n>25){
return toast(
"Gents ring size must be 17 to 25"
);
}

}

const old=oid
?
(c.orders||[]).find(x=>x.id===oid)
:
null;

const data={

id:oid||uid(),

orderNo:no,

item:document
.getElementById('o_item')
.value.trim(),

startDate:document
.getElementById('o_start')
.value,

status:document
.getElementById('o_status')
.value,

advance:Number(
document
.getElementById('o_advance')
.value||0
),

weight:document
.getElementById('o_weight')
.value.trim(),

touch:document
.getElementById('o_touch')
.value.trim(),

screw:document
.getElementById('o_screw')
.value.trim(),

ladySize,

gentsSize,

notes:document
.getElementById('o_notes')
.value.trim(),

createdAt:
old?.createdAt||
new Date().toISOString()

};

c.orders=c.orders||[];

if(oid){

const i=c.orders.findIndex(
x=>x.id===oid
);

if(i>=0){
c.orders[i]=data;
}

}else{

c.orders.push(data);

}

saveDB();

closeModal();

go('orders');

toast(
oid
?
'Order updated ✓'
:
'Order saved ✓'
);

}

.replaceAll(
'{{name}}',
c?.name||''
)
.replaceAll(
'{{phone}}',
c?.mobile||''
)
.replaceAll(
'{{company}}',

)
.replaceAll(
'{{orderNo}}',
o?.orderNo||''
)
.replaceAll(
'{{item}}',
o?.item||''
)
.replaceAll(
'{{weight}}',
o?.weight||''
)
.replaceAll(
'{{touch}}',
o?.touch||''
)
.replaceAll(
'{{screw}}',
o?.screw||''
)
.replaceAll(
'{{ladySize}}',
o?.ladySize||''
)
.replaceAll(
'{{gentsSize}}',
o?.gentsSize||''
)
.replaceAll(
'{{advance}}',
money(o?.advance||0)
)
.replaceAll(
'{{status}}',
o?.status||''

o?.startDate||''

function exportBackup(){

const blob=
new Blob(
[
JSON.stringify(
DB,
null,
2
)
],
{
type:'application/json'
}
);

const a=
document.createElement('a');

a.href=
URL.createObjectURL(blob);

a.download=
'shree-ji-connect-backup-'+
today()+
'.json';

a.click();

setTimeout(
()=>{
URL.revokeObjectURL(
a.href
);
},
1000
);

toast(
'Backup downloaded ✓'
);

}

function importBackup(e){

const f=
e.target.files?.[0];

if(!f)return;

const r=
new FileReader();

r.onload=()=>{

try{

const d=
JSON.parse(
r.result
);

if(
!Array.isArray(d.customers)||
!Array.isArray(d.templates)
){
throw Error();
}

if(
!confirm(
'Replace current data with this backup?'
)
)return;

DB=d;

saveDB();

go('dashboard');

toast(
'Backup restored ✓'
);

}catch(x){

toast(
'Invalid backup file'
);

}

};

r.readAsText(f);

}

function resetData(){

if(!confirm(
'Reset ALL customers, orders and templates?'
))return;

DB={
customers:[],
templates:defaultTemplates()
};

saveDB();

go('dashboard');

toast(
'All data reset'
);

}
