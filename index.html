<link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><title>SHREE JI CONNECT</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f5f5;color:#171717}.top{height:76px;background:#111;color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px;position:sticky;top:0;z-index:30}.menuBtn{width:46px;height:46px;border:0;background:transparent;color:#fff;font-size:29px}.logo{width:48px;height:48px;border-radius:50%;background:#d4ad58;color:#111;display:grid;place-items:center;font-weight:800}.top h1{font-size:18px;margin:0}.top small{color:#ccc}.wrap{max-width:1150px;margin:auto;padding:18px 14px 55px}.drawer{position:fixed;inset:0;z-index:100;pointer-events:none}.drawer:before{content:"";position:absolute;inset:0;background:#0008;opacity:0;transition:.2s}.drawer.open{pointer-events:auto}.drawer.open:before{opacity:1}.side{position:absolute;left:0;top:0;bottom:0;width:min(330px,88vw);background:#fff;transform:translateX(-100%);transition:.25s;box-shadow:5px 0 25px #0003;overflow:auto}.drawer.open .side{transform:translateX(0)}.sideHead{background:#111;color:#fff;padding:18px;display:flex;align-items:center;gap:12px}.sideHead .logo{width:44px;height:44px}.sideHead b{font-size:16px}.sideHead small{display:block;color:#ccc;margin-top:3px}.sideClose{margin-left:auto;background:#333;color:#fff;border:0;border-radius:50%;width:36px;height:36px;font-size:22px}.sideNav{padding:12px}.sideNav button{width:100%;border:0;background:#fff;text-align:left;padding:14px;border-radius:12px;font-size:16px;font-weight:700;margin:3px 0}.sideNav button.active{background:#f2dfad}.card{background:#fff;border-radius:20px;padding:18px;margin:13px 0;box-shadow:0 2px 14px #0000000d}.hero{padding:24px}.hero h2{font-size:28px;margin:0 0 8px}.muted{color:#777}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#fff;border-radius:18px;padding:18px;box-shadow:0 2px 12px #0000000d}.stat b{font-size:27px;display:block;margin-bottom:6px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.field{margin:11px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:13px;border:1px solid #ddd;border-radius:11px;font-size:16px;background:#fff}.field textarea{min-height:105px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:11px;padding:11px 15px;background:#eee;font-weight:700;font-size:15px;cursor:pointer}.gold{background:#d0aa55;color:#fff}.green{background:#168b58;color:#fff}.red{background:#d84b4b;color:#fff}.dark{background:#222;color:#fff}.small{padding:8px 10px;font-size:13px}.search{width:100%;padding:13px;border:1px solid #ddd;border-radius:11px;font-size:16px}.customer,.order,.template{border:1px solid #eee;border-radius:15px;padding:15px;margin:10px 0}.customer h3{margin:0 0 7px}.pill{display:inline-block;padding:5px 9px;border-radius:20px;background:#eee;font-size:12px;font-weight:700}.history{border-top:1px solid #eee;margin-top:13px;padding-top:13px}.preview{background:#f8f8f8;border-radius:12px;padding:13px;white-space:pre-wrap}.empty{text-align:center;color:#888;padding:28px}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:150;align-items:flex-end}.modal.show{display:flex}.box{background:#fff;width:100%;max-width:760px;margin:auto;border-radius:22px 22px 0 0;padding:20px;max-height:94vh;overflow:auto}.close{float:right;border:0;background:#eee;border-radius:50%;width:35px;height:35px;font-size:20px}.toast{display:none;position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:12px 17px;border-radius:10px;z-index:200;max-width:90%;text-align:center}.footer{text-align:center;color:#888;font-size:12px;padding:20px}.checkrow{display:flex;align-items:center;gap:9px;padding:10px 0;border-bottom:1px solid #eee}.checkrow input{width:20px;height:20px}.kpiTitle{font-size:14px;color:#777}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.reportBox{border:1px solid #eee;border-radius:16px;padding:15px}.reportBox h3{margin:0 0 12px}.big{font-size:23px;font-weight:800}.filterbar{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:720px){.stats,.grid4{grid-template-columns:1fr 1fr}.grid2,.grid3,.quick,.filterbar{grid-template-columns:1fr}.hero h2{font-size:24px}}
</style></head>
<body>
<header class="top"><button class="menuBtn" onclick="openDrawer()" aria-label="Menu">☰</button><div class="logo">SJ</div><div><h1>SHREE JI CONNECT</h1><small>SHREE JI GOLD CREATOR LLP</small></div></header>
<div id="drawer" class="drawer" onclick="if(event.target===this)closeDrawer()"><aside class="side"><div class="sideHead"><div class="logo">SJ</div><div><b>SHREE JI CONNECT</b><small>SHREE JI GOLD CREATOR LLP</small></div><button class="sideClose" onclick="closeDrawer()">×</button></div><nav class="sideNav" id="sideNav">
<button data-page="dashboard" onclick="go('dashboard')">🏠 Dashboard</button><button data-page="customers" onclick="go('customers')">👥 Customer CRM</button><button data-page="orders" onclick="go('orders')">📦 Order Management</button><button data-page="reports" onclick="go('reports')">📊 Database Reports</button><button data-page="whatsapp" onclick="go('whatsapp')">💬 WhatsApp Center</button><button data-page="templates" onclick="go('templates')">📝 Message Templates</button><button data-page="backup" onclick="go('backup')">💾 Backup & Restore</button><button data-page="settings" onclick="go('settings')">⚙️ Settings</button>
</nav></aside></div>
<div class="wrap"><main id="app"></main><div class="footer">SHREE JI CONNECT • Business data stays in this browser unless you export a backup.</div></div>
<div id="modal" class="modal"><div class="box"><button class="close" onclick="closeModal()">×</button><div id="form"></div></div></div><div id="toast" class="toast"></div>
<script>
const KEY='shree_ji_connect_v3';let DB=loadDB();
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function defaultTemplates(){return [['Exhibition Invite','Dear {{name}},\n\nYou are warmly invited to visit SHREE JI GOLD CREATOR LLP at our exhibition.'],['Festival Greeting','Dear {{name}},\n\nWarm festival wishes from SHREE JI GOLD CREATOR LLP.'],['Stall Visit Thank You','Dear {{name}},\n\nThank you for visiting our stall. It was a pleasure meeting you.'],['Order Thank You','Dear {{name}},\n\nThank you for your valuable order {{orderNo}}.'],['Order Started','Dear {{name}},\n\nYour order {{orderNo}} has been started.\nStatus: {{status}}'],['Order Completed','Dear {{name}},\n\nYour order {{orderNo}} has been completed successfully.'],['Ready for Delivery','Dear {{name}},\n\nYour order {{orderNo}} is ready for delivery.'],['Delivery Update','Dear {{name}},\n\nUpdate for order {{orderNo}}: {{status}}.'],['Review Request','Dear {{name}},\n\nThank you for your order. We would appreciate your valuable feedback.'],['Repeat Order','Dear {{name}},\n\nWe would be happy to serve you again.'],['New Collection','Dear {{name}},\n\nOur new jewellery collection is now available.'],['Follow-up','Dear {{name}},\n\nJust following up regarding your order / enquiry.']].map(([name,message])=>({id:uid(),name,message}))}
function loadDB(){try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d&&Array.isArray(d.customers)&&Array.isArray(d.templates))return d}catch(e){}return{customers:[],templates:defaultTemplates(),settings:{company:'SHREE JI GOLD CREATOR LLP'}}}
function saveDB(){localStorage.setItem(KEY,JSON.stringify(DB))}function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function money(x){return Number(x||0).toLocaleString('en-IN')}function today(){return new Date().toISOString().slice(0,10)}
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>x.style.display='none',1900)}function openDrawer(){document.getElementById('drawer').classList.add('open')}function closeDrawer(){document.getElementById('drawer').classList.remove('open')}
function go(p){closeDrawer();document.querySelectorAll('#sideNav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));({dashboard,customers:customersPage,orders:ordersPage,reports:reportsPage,whatsapp:whatsappPage,templates:templatesPage,backup:backupPage,settings:settingsPage}[p]||dashboard)()}
function allOrders(){return DB.customers.flatMap(c=>(c.orders||[]).map(o=>({...o,customerId:c.id,customerName:c.name,mobile:c.mobile,shop:c.shop,city:c.city}))).sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''))}
function grams(v){let s=String(v??'').replace(/,/g,'').trim();if(!s)return 0;let n=parseFloat(s);if(!Number.isFinite(n))return 0;if(/kg/i.test(s))return n*1000;return n}
function fmtGram(g){return g>=1000?(g/1000).toFixed(3)+' kg':g.toFixed(3)+' g'}
function statusActive(s){return !['Completed','Delivered'].includes(s||'')}
function reportData(type){const os=allOrders().filter(o=>type==='All'||o.orderType===type);return{orders:os.length,total:os.reduce((s,o)=>s+grams(o.totalWeight),0),started:os.reduce((s,o)=>s+grams(o.startedWeight),0),balance:os.reduce((s,o)=>s+Math.max(0,grams(o.totalWeight)-grams(o.startedWeight)),0),completed:os.filter(o=>['Completed','Delivered'].includes(o.status)).length,pending:os.filter(o=>!['Completed','Delivered'].includes(o.status)).length,advance:os.reduce((s,o)=>s+Number(o.advance||0),0)}}
function reportBox(title,d){return `<div class="reportBox"><h3>${title}</h3><div class="grid2"><div><span class="muted">Orders</span><div class="big">${d.orders}</div></div><div><span class="muted">Total Weight</span><div class="big">${fmtGram(d.total)}</div></div><div><span class="muted">Started</span><div class="big">${fmtGram(d.started)}</div></div><div><span class="muted">Balance</span><div class="big">${fmtGram(d.balance)}</div></div><div><span class="muted">Completed</span><div class="big">${d.completed}</div></div><div><span class="muted">Pending</span><div class="big">${d.pending}</div></div></div></div>`}
function dashboard(){const all=reportData('All'),direct=reportData('Direct'),sm=reportData('SM');document.getElementById('app').innerHTML=`<section class="card hero"><h2>Welcome to SHREE JI CONNECT 👋</h2><p class="muted">Customer, Order & Production Database</p><div class="actions"><button class="btn gold" onclick="openCustomer()">＋ Add Customer</button><button class="btn" onclick="newOrderFromOrders()">📦 New Order</button><button class="btn dark" onclick="go('reports')">📊 Reports</button></div></section><div class="stats"><div class="stat"><b>${DB.customers.length}</b><span class="kpiTitle">Total Customers</span></div><div class="stat"><b>${all.orders}</b><span class="kpiTitle">Total Orders</span></div><div class="stat"><b>${fmtGram(all.balance)}</b><span class="kpiTitle">Balance Weight</span></div><div class="stat"><b>${all.pending}</b><span class="kpiTitle">Pending Orders</span></div></div><section class="card"><h2>📊 Direct / SM Summary</h2><div class="grid2">${reportBox('🟢 DIRECT — Our Supply',direct)}${reportBox('🔵 SM — Dealer Supply',sm)}</div></section><section class="card"><h2>🔔 Today's Follow-ups</h2>${followupList(true)}</section><section class="card"><h2>📦 Recent Orders</h2>${allOrders().slice(0,5).map(orderCard).join('')||'<div class="empty">No orders yet.</div>'}</section>`}
function customersPage(){document.getElementById('app').innerHTML=`<section class="card"><div class="actions" style="justify-content:space-between"><h2 style="margin:0">👥 Customer CRM</h2><button class="btn gold" onclick="openCustomer()">＋ Add Customer</button></div><div class="field"><input id="custSearch" class="search" placeholder="Search name, WhatsApp, shop, city or exhibition..." oninput="renderCustomers()"></div><div id="customerList"></div></section>`;renderCustomers()}
function renderCustomers(){const q=(document.getElementById('custSearch')?.value||'').toLowerCase();const a=DB.customers.filter(c=>(c.name+' '+c.mobile+' '+c.shop+' '+c.city+' '+c.notes+' '+c.exhibition).toLowerCase().includes(q));document.getElementById('customerList').innerHTML=a.length?a.map(customerCard).join(''):'<div class="empty">No customers found.</div>'}
function customerCard(c){return `<div class="customer"><h3>${esc(c.name)}</h3><div>📱 ${esc(c.mobile)}</div><div>🏪 ${esc(c.shop||'-')}</div><div>📍 ${esc(c.city||'-')}</div><div>🎪 ${esc(c.exhibition||'-')}</div>${c.notes?`<div>📝 ${esc(c.notes)}</div>`:''}<div class="actions" style="margin-top:11px"><button class="btn gold small" onclick="addOrder('${c.id}')">＋ Add Order</button><button class="btn small" onclick="editCustomer('${c.id}')">✏️ Edit</button><button class="btn small green" onclick="whatsappCustomer('${c.id}')">💬 WhatsApp</button><button class="btn small" onclick="openCustomerHistory('${c.id}')">📋 History</button><button class="btn red small" onclick="deleteCustomer('${c.id}')">🗑 Delete</button></div><div class="history"><b>📦 Customer History (${(c.orders||[]).length})</b>${(c.orders||[]).length?(c.orders||[]).slice().reverse().map(o=>orderCard({...o,customerName:c.name,customerId:c.id})).join(''):'<div class="empty">No previous orders</div>'}</div></div>`}
function openCustomer(editId=null){const c=editId?DB.customers.find(x=>x.id===editId):null;document.getElementById('form').innerHTML=`<h2>${c?'✏️ Edit Customer':'👤 Add Customer'}</h2><div class="actions"><button class="btn" type="button" onclick="startScan()">📷 Scan Visiting Card</button></div><div class="field"><label>Name *</label><input id="c_name" value="${esc(c?.name||'')}" placeholder="Customer name"></div><div class="field"><label>WhatsApp Number *</label><input id="c_mobile" inputmode="tel" value="${esc(c?.mobile||'')}" placeholder="10 digit mobile number"></div><div class="grid2"><div class="field"><label>Shop / Company</label><input id="c_shop" value="${esc(c?.shop||'')}"></div><div class="field"><label>City</label><input id="c_city" value="${esc(c?.city||'')}"></div></div><div class="field"><label>Exhibition Name</label><input id="c_exhibition" value="${esc(c?.exhibition||'')}" placeholder="Manual entry"></div><div class="field"><label>Notes</label><textarea id="c_notes">${esc(c?.notes||'')}</textarea></div><div class="actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn gold" onclick="${c?`updateCustomer('${c.id}')`:'saveCustomer()'}">${c?'Save Changes':'Save Customer'}</button></div>`;showModal()}
function startScan(){toast('Camera/OCR feature is ready for the next OCR integration; you can still add the card photo manually.')}
function saveCustomer(){const name=c_name.value.trim(),mobile=c_mobile.value.trim();if(!name||!mobile)return toast('Name and WhatsApp number are required');DB.customers.push({id:uid(),name,mobile,shop:c_shop.value.trim(),city:c_city.value.trim(),exhibition:c_exhibition.value.trim(),notes:c_notes.value.trim(),createdAt:new Date().toISOString(),orders:[],followups:[]});saveDB();closeModal();go('customers');toast('Customer added ✓')}
function editCustomer(id){openCustomer(id)}function updateCustomer(id){const c=DB.customers.find(x=>x.id===id);if(!c)return;c.name=c_name.value.trim();c.mobile=c_mobile.value.trim();c.shop=c_shop.value.trim();c.city=c_city.value.trim();c.exhibition=c_exhibition.value.trim();c.notes=c_notes.value.trim();if(!c.name||!c.mobile)return toast('Name and WhatsApp number are required');saveDB();closeModal();go('customers');toast('Customer updated ✓')}
function deleteCustomer(id){if(!confirm('Delete this customer and all order history?'))return;DB.customers=DB.customers.filter(c=>c.id!==id);saveDB();renderCustomers();toast('Customer deleted')}
function addOrder(cid){const c=DB.customers.find(x=>x.id===cid);if(c)orderForm(c)}
function orderForm(c,oid=null){const o=oid?(c.orders||[]).find(x=>x.id===oid):null;document.getElementById('form').innerHTML=`<h2>${o?'✏️ Edit Order':'📦 New Order'}</h2><p><b>${esc(c.name)}</b> • ${esc(c.mobile)}</p><div class="grid2"><div class="field"><label>Order Number *</label><input id="o_no" value="${esc(o?.orderNo||'')}"></div><div class="field"><label>Order Type *</label><select id="o_type"><option value="Direct" ${o?.orderType==='Direct'?'selected':''}>Direct — Our Supply</option><option value="SM" ${o?.orderType==='SM'?'selected':''}>SM — Dealer Supply</option></select></div></div><div class="grid2"><div class="field"><label>Start Date</label><input id="o_start" type="date" value="${esc(o?.startDate||today())}"></div><div class="field"><label>Status</label><select id="o_status">${['Pending','Started','Processing','Completed','Ready for Delivery','Delivered'].map(s=>`<option ${o?.status===s?'selected':''}>${s}</option>`).join('')}</select></div></div><div class="grid2"><div class="field"><label>Advance — GPay / Cash</label><input id="o_advance" value="${esc(o?.advance||'')}" placeholder="Example: GPay 50000 / Cash 20000"></div><div class="field"><label>Total Order Weight</label><input id="o_totalWeight" value="${esc(o?.totalWeight||'')}" placeholder="Example: 500g or 0.500kg"></div></div><div class="grid2"><div class="field"><label>Started Weight</label><input id="o_startedWeight" value="${esc(o?.startedWeight||'')}" placeholder="Example: 300g"></div><div class="field"><label>Balance Weight</label><input id="o_balanceWeight" value="" placeholder="Auto calculated" readonly></div></div><div class="grid2"><div class="field"><label>Gold Touch</label><input id="o_touch" value="${esc(o?.touch||'')}" placeholder="Example: 916"></div><div class="field"><label>Screw Type</label><input id="o_screw" value="${esc(o?.screw||'')}" placeholder="Example: Screw / Hook"></div></div><div class="field"><label>Ring Size</label><input id="o_ring" inputmode="numeric" value="${esc(o?.ringSize||'')}" placeholder="Lady's 9–15 / Gents 17–25 — type number manually"></div><div class="field"><label>Exhibition Name</label><input id="o_exhibition" value="${esc(o?.exhibition||c.exhibition||'')}" placeholder="Manual entry"></div><div class="field"><label>Order Notes</label><textarea id="o_notes">${esc(o?.notes||'')}</textarea></div><div class="actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn gold" onclick="saveOrder('${c.id}','${oid||''}')">${o?'Update Order':'Save Order'}</button></div>`;showModal();updateBalanceField()}
function updateBalanceField(){const a=document.getElementById('o_totalWeight'),b=document.getElementById('o_startedWeight'),out=document.getElementById('o_balanceWeight');if(!a||!b||!out)return;const f=()=>out.value=fmtGram(Math.max(0,grams(a.value)-grams(b.value)));a.oninput=f;b.oninput=f;f()}
function saveOrder(cid,oid){const c=DB.customers.find(x=>x.id===cid);if(!c)return;const no=o_no.value.trim();if(!no)return toast('Order Number is required');const old=oid?(c.orders||[]).find(x=>x.id===oid):null;const total=grams(o_totalWeight.value),started=grams(o_startedWeight.value);const data={id:oid||uid(),orderNo:no,orderType:o_type.value,startDate:o_start.value,status:o_status.value,advance:o_advance.value.trim(),totalWeight:o_totalWeight.value.trim(),startedWeight:o_startedWeight.value.trim(),balanceWeight:Math.max(0,total-started),touch:o_touch.value.trim(),screw:o_screw.value.trim(),ringSize:o_ring.value.trim(),exhibition:o_exhibition.value.trim(),notes:o_notes.value.trim(),createdAt:old?.createdAt||new Date().toISOString()};c.orders=c.orders||[];if(oid){const i=c.orders.findIndex(x=>x.id===oid);if(i>=0)c.orders[i]=data}else c.orders.push(data);saveDB();closeModal();go('orders');toast(oid?'Order updated ✓':'Order saved ✓')}
function orderCard(o){return `<div class="order"><div class="actions" style="justify-content:space-between"><b>📦 ${esc(o.orderNo||'Order')}</b><span class="pill">${esc(o.orderType||'Direct')} • ${esc(o.status||'Pending')}</span></div><div>👤 ${esc(o.customerName||'Customer')} ${o.shop?'• '+esc(o.shop):''}</div><div>🎪 ${esc(o.exhibition||'-')}</div><div>⚖️ Total: ${esc(o.totalWeight||'-')} &nbsp; ▶ Started: ${esc(o.startedWeight||'-')} &nbsp; ◀ Balance: ${fmtGram(grams(o.totalWeight)-grams(o.startedWeight))}</div><div>💳 Advance: ${esc(o.advance||'-')} &nbsp; 🪙 Touch: ${esc(o.touch||'-')} &nbsp; 🔩 Screw: ${esc(o.screw||'-')}</div><div>💍 Ring: ${esc(o.ringSize||'-')} &nbsp; 📅 Start: ${esc(o.startDate||'-')}</div>${o.notes?`<div>📝 ${esc(o.notes)}</div>`:''}<div class="actions" style="margin-top:8px"><button class="btn small" onclick="editOrder('${o.customerId}','${o.id}')">✏️ Edit</button><button class="btn red small" onclick="deleteOrder('${o.customerId}','${o.id}')">🗑 Delete</button></div></div>`}
function ordersPage(){document.getElementById('app').innerHTML=`<section class="card"><div class="actions" style="justify-content:space-between"><h2 style="margin:0">📦 Order Management</h2><button class="btn gold" onclick="newOrderFromOrders()">＋ New Order</button></div><div class="field"><input id="orderSearch" class="search" placeholder="Search order, customer, type, exhibition or status..." oninput="renderOrders()"></div><div id="ordersList"></div></section>`;renderOrders()}
function newOrderFromOrders(){if(!DB.customers.length)return toast('Add a customer first');document.getElementById('form').innerHTML=`<h2>📦 Select Customer</h2>${DB.customers.map(c=>`<button class="btn" style="width:100%;text-align:left;margin:4px 0" onclick="closeModal();addOrder('${c.id}')">👤 ${esc(c.name)} — ${esc(c.mobile)}</button>`).join('')}`;showModal()}
function renderOrders(){const q=(document.getElementById('orderSearch')?.value||'').toLowerCase();const os=allOrders().filter(o=>(o.orderNo+' '+o.customerName+' '+o.status+' '+o.orderType+' '+o.exhibition+' '+o.totalWeight).toLowerCase().includes(q));document.getElementById('ordersList').innerHTML=os.length?os.map(orderCard).join(''):'<div class="empty">No orders found.</div>'}
function editOrder(cid,oid){const c=DB.customers.find(x=>x.id===cid);if(c)orderForm(c,oid)}function deleteOrder(cid,oid){if(!confirm('Delete this order?'))return;const c=DB.customers.find(x=>x.id===cid);if(!c)return;c.orders=(c.orders||[]).filter(o=>o.id!==oid);saveDB();go('orders');toast('Order deleted')}
function openCustomerHistory(cid){const c=DB.customers.find(x=>x.id===cid);if(!c)return;document.getElementById('form').innerHTML=`<h2>📋 ${esc(c.name)} — History</h2><p>📱 ${esc(c.mobile)}<br>🏪 ${esc(c.shop||'-')} • 📍 ${esc(c.city||'-')}<br>🎪 ${esc(c.exhibition||'-')}</p>${(c.orders||[]).length?(c.orders||[]).slice().reverse().map(o=>orderCard({...o,customerName:c.name,customerId:c.id})).join(''):'<div class="empty">No previous orders</div>'}`;showModal()}
function reportsPage(){document.getElementById('app').innerHTML=`<section class="card"><h2>📊 Database Reports</h2><p class="muted">Owner can instantly see Direct vs SM order count and weight.</p><div class="filterbar"><div class="field"><label>Order Type</label><select id="r_type" onchange="renderReports()"><option>All</option><option>Direct</option><option>SM</option></select></div><div class="field"><label>Status</label><select id="r_status" onchange="renderReports()"><option>All</option><option>Pending</option><option>Started</option><option>Processing</option><option>Completed</option><option>Ready for Delivery</option><option>Delivered</option></select></div><div class="field"><label>Exhibition</label><input id="r_expo" oninput="renderReports()" placeholder="Manual exhibition name"></div><div class="field"><label>Customer / Order Search</label><input id="r_search" oninput="renderReports()" placeholder="Search"></div></div><div id="reportResult"></div></section><section class="card"><h2>🎪 Exhibition Summary</h2><div id="expoResult"></div></section>`;renderReports();renderExhibitions()}
function filteredReportOrders(){let os=allOrders(),type=document.getElementById('r_type')?.value||'All',status=document.getElementById('r_status')?.value||'All',expo=(document.getElementById('r_expo')?.value||'').toLowerCase(),q=(document.getElementById('r_search')?.value||'').toLowerCase();return os.filter(o=>(type==='All'||o.orderType===type)&&(status==='All'||o.status===status)&&(!expo||String(o.exhibition||'').toLowerCase().includes(expo))&&(!q||(o.orderNo+' '+o.customerName+' '+o.shop+' '+o.city+' '+o.exhibition).toLowerCase().includes(q)))}
function renderReports(){const os=filteredReportOrders();const d={orders:os.length,total:os.reduce((s,o)=>s+grams(o.totalWeight),0),started:os.reduce((s,o)=>s+grams(o.startedWeight),0),balance:os.reduce((s,o)=>s+Math.max(0,grams(o.totalWeight)-grams(o.startedWeight)),0),completed:os.filter(o=>['Completed','Delivered'].includes(o.status)).length,pending:os.filter(o=>!['Completed','Delivered'].includes(o.status)).length};document.getElementById('reportResult').innerHTML=`<div class="grid3" style="margin-top:14px"><div class="reportBox"><span class="muted">Orders</span><div class="big">${d.orders}</div></div><div class="reportBox"><span class="muted">Total Weight</span><div class="big">${fmtGram(d.total)}</div></div><div class="reportBox"><span class="muted">Started</span><div class="big">${fmtGram(d.started)}</div></div><div class="reportBox"><span class="muted">Balance</span><div class="big">${fmtGram(d.balance)}</div></div><div class="reportBox"><span class="muted">Completed</span><div class="big">${d.completed}</div></div><div class="reportBox"><span class="muted">Pending</span><div class="big">${d.pending}</div></div></div><div style="margin-top:14px">${os.slice(0,30).map(orderCard).join('')||'<div class="empty">No matching orders.</div>'}</div>`}
function renderExhibitions(){const box=document.getElementById('expoResult');if(!box)return;const map={};allOrders().forEach(o=>{const k=o.exhibition||'No Exhibition';map[k]??={orders:0,weight:0,started:0};map[k].orders++;map[k].weight+=grams(o.totalWeight);map[k].started+=grams(o.startedWeight)});box.innerHTML=Object.keys(map).length?Object.entries(map).map(([k,v])=>`<div class="reportBox" style="margin:8px 0"><b>🎪 ${esc(k)}</b><br>Orders: ${v.orders} • Total: ${fmtGram(v.weight)} • Started: ${fmtGram(v.started)} • Balance: ${fmtGram(Math.max(0,v.weight-v.started))}</div>`).join(''):'<div class="empty">No exhibition data yet.</div>'}
function followupList(todayOnly=false){const rows=[];DB.customers.forEach(c=>(c.followups||[]).forEach(f=>{if(!todayOnly||f.date===today())rows.push({c,f})}));return rows.length?rows.sort((a,b)=>a.f.date.localeCompare(b.f.date)).map(x=>`<div class="order"><b>${esc(x.c.name)}</b> • ${esc(x.f.date)}<br>${esc(x.f.note||'Follow-up')}<div class="actions" style="margin-top:7px"><button class="btn green small" onclick="whatsappCustomer('${x.c.id}')">💬 WhatsApp</button></div></div>`).join(''):'<div class="empty">No follow-ups.</div>'}
function addFollowup(cid){const c=DB.customers.find(x=>x.id===cid);if(!c)return;document.getElementById('form').innerHTML=`<h2>🔔 Add Follow-up</h2><p><b>${esc(c.name)}</b></p><div class="field"><label>Date</label><input id="f_date" type="date" value="${today()}"></div><div class="field"><label>Note</label><textarea id="f_note" placeholder="Follow-up note"></textarea></div><button class="btn gold" onclick="saveFollowup('${cid}')">Save Follow-up</button>`;showModal()}
function saveFollowup(cid){const c=DB.customers.find(x=>x.id===cid);if(!c)return;c.followups=c.followups||[];c.followups.push({id:uid(),date:f_date.value,note:f_note.value.trim()});saveDB();closeModal();toast('Follow-up saved ✓')}
function whatsappCustomer(id){sessionStorage.setItem('waCustomerId',id);go('whatsapp')}
function normalizePhone(p){let n=String(p||'').replace(/\D/g,'');if(n.length===10)n='91'+n;return n}
function whatsappPage(){const pending=sessionStorage.getItem('waCustomerId')||'';sessionStorage.removeItem('waCustomerId');document.getElementById('app').innerHTML=`<section class="card"><h2>💬 WhatsApp Center</h2><div class="field"><label>Select Customer</label><select id="wa_customer" onchange="loadWAForCustomer(this.value)"><option value="">— Select customer —</option>${DB.customers.map(c=>`<option value="${c.id}" ${c.id===pending?'selected':''}>${esc(c.name)} — ${esc(c.mobile)}</option>`).join('')}</select></div><div class="field"><label>WhatsApp Number</label><input id="wa_phone" inputmode="tel" placeholder="Select customer or enter number manually"></div><div class="field"><label>Message</label><textarea id="wa_message" placeholder="Type your message..."></textarea></div><button class="btn green" onclick="openWhatsApp()">💬 Open WhatsApp</button></section><section class="card"><h2>🔔 Follow-up</h2><p class="muted">Add follow-up from the customer card/history.</p>${followupList(false)}</section>`;if(pending)loadWAForCustomer(pending)}
function loadWAForCustomer(id){const c=DB.customers.find(x=>x.id===id);if(!c)return;wa_phone.value=c.mobile||'';const o=(c.orders||[]).slice(-1)[0],t=DB.templates.find(x=>x.name==='Order Thank You')||DB.templates[0];if(t)wa_message.value=applyTemplate(t.message,c,o)}
function openWhatsApp(){const n=normalizePhone(wa_phone.value),m=wa_message.value.trim();if(!n)return toast('Select a customer or enter WhatsApp number');if(!m)return toast('Enter a message');window.open('https://wa.me/'+n+'?text='+encodeURIComponent(m),'_blank')}
function getTemplate(id){return DB.templates.find(t=>t.id===id)}function applyTemplate(msg,c,o){return String(msg||'').replaceAll('{{name}}',c?.name||'').replaceAll('{{phone}}',c?.mobile||'').replaceAll('{{company}}',DB.settings?.company||'SHREE JI GOLD CREATOR LLP').replaceAll('{{orderNo}}',o?.orderNo||'').replaceAll('{{weight}}',o?.totalWeight||'').replaceAll('{{touch}}',o?.touch||'').replaceAll('{{screw}}',o?.screw||'').replaceAll('{{status}}',o?.status||'').replaceAll('{{date}}',o?.startDate||'')}
function templatesPage(){document.getElementById('app').innerHTML=`<section class="card"><div class="actions" style="justify-content:space-between"><h2 style="margin:0">📝 Message Templates</h2><button class="btn green" onclick="addTemplate()">＋ New Template</button></div><p class="muted">Placeholders: {{name}}, {{phone}}, {{company}}, {{orderNo}}, {{weight}}, {{touch}}, {{screw}}, {{status}}, {{date}}</p><div id="templateList"></div></section>`;renderTemplates()}
function renderTemplates(){const b=document.getElementById('templateList');if(!b)return;b.innerHTML=DB.templates.length?DB.templates.map(t=>`<div class="template"><h3>📝 ${esc(t.name)}</h3><div class="preview">${esc(t.message)}</div><div class="actions" style="margin-top:10px"><button class="btn small" onclick="editTemplate('${t.id}')">✏️ Edit</button><button class="btn red small" onclick="deleteTemplate('${t.id}')">🗑 Delete</button></div></div>`).join(''):'<div class="empty">No templates yet.</div>'}
function addTemplate(tid=null){const t=tid?DB.templates.find(x=>x.id===tid):null;document.getElementById('form').innerHTML=`<h2>${t?'✏️ Edit Template':'📝 Create Template'}</h2><div class="field"><label>Template Name</label><input id="t_name" value="${esc(t?.name||'')}"></div><div class="field"><label>Message</label><textarea id="t_message">${esc(t?.message||'')}</textarea></div><div class="actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn green" onclick="saveTemplate('${tid||''}')">Save Template</button></div>`;showModal()}
function editTemplate(id){addTemplate(id)}function saveTemplate(id){const name=t_name.value.trim(),message=t_message.value;if(!name||!message)return toast('Template name and message are required');if(id){const t=DB.templates.find(x=>x.id===id);t.name=name;t.message=message}else DB.templates.push({id:uid(),name,message});saveDB();closeModal();go('templates');toast('Template saved ✓')}function deleteTemplate(id){if(!confirm('Delete this template?'))return;DB.templates=DB.templates.filter(t=>t.id!==id);saveDB();renderTemplates();toast('Template deleted')}
function backupPage(){document.getElementById('app').innerHTML=`<section class="card"><h2>💾 Backup & Restore</h2><p>Export customers, full order history, follow-ups, settings and templates as JSON.</p><div class="actions"><button class="btn green" onclick="exportBackup()">⬇️ Export Backup</button><label class="btn" style="cursor:pointer">⬆️ Import Backup<input id="importFile" type="file" accept="application/json" hidden onchange="importBackup(event)"></label></div></section><section class="card"><h2>📊 Data Summary</h2><div class="grid3"><div><b>${DB.customers.length}</b><br><span class="muted">Customers</span></div><div><b>${allOrders().length}</b><br><span class="muted">Orders</span></div><div><b>${DB.templates.length}</b><br><span class="muted">Templates</span></div></div></section><section class="card"><h2>⚠️ Reset</h2><p class="muted">Export a backup first. Reset permanently clears browser data.</p><button class="btn red" onclick="resetData()">Reset All Data</button></section>`}
function exportBackup(){const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='shree-ji-connect-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Backup downloaded ✓')}
function importBackup(e){const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.customers)||!Array.isArray(d.templates))throw Error();if(!confirm('Replace current data with this backup?'))return;DB=d;saveDB();go('dashboard');toast('Backup restored ✓')}catch(x){toast('Invalid backup file')}};r.readAsText(f)}
function resetData(){if(!confirm('Reset ALL customers, orders and templates?'))return;DB={customers:[],templates:defaultTemplates(),settings:{company:'SHREE JI GOLD CREATOR LLP'}};saveDB();go('dashboard');toast('All data reset')}
function settingsPage(){document.getElementById('app').innerHTML=`<section class="card"><h2>⚙️ Settings</h2><div class="field"><label>Company Name</label><input id="s_company" value="${esc(DB.settings?.company||'SHREE JI GOLD CREATOR LLP')}"></div><p class="muted">Company logo is fixed in the app. Direct / SM is selected per order.</p><button class="btn gold" onclick="saveSettings()">Save Settings</button></section><section class="card"><h3>📌 Order Types</h3><p><b>Direct</b> — Our Supply</p><p><b>SM</b> — Dealer Supply</p><p class="muted">Reports automatically separate order count, total weight, started weight and balance weight.</p></section>`}
function saveSettings(){DB.settings=DB.settings||{};DB.settings.company=s_company.value.trim()||'SHREE JI GOLD CREATOR LLP';saveDB();toast('Settings saved ✓')}
function showModal(){document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeDrawer()}});go('dashboard');if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
